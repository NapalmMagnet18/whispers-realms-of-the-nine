# Far-off one-shots, Diablo style: every 18-45 s a player hears one of their area's, panned off somewhere unseen.
stingers:
  every: [18, 45]
  volume: 0.35
  sets:
    forest: [/cdn/moodboard-painterly-fantasy/sfx-distant-wolf-howl-echoing-through-forest.mp3, /cdn/moodboard-painterly-fantasy/sfx-branch-snapping-deep-in-woods-far.mp3, /cdn/moodboard-painterly-fantasy/sfx-owl-hoot-twice-in-dark-forest.mp3]
    wilds: [/cdn/moodboard-painterly-fantasy/sfx-distant-wolf-howl-echoing-through-forest.mp3, /cdn/moodboard-painterly-fantasy/sfx-hawk-cry-high-overhead-open-sky.mp3]
    ashen: [/cdn/moodboard-gothic-horror/sfx-crow-caw-flock-taking-off-from-dead-tree.mp3, /cdn/moodboard-gothic-horror/sfx-distant-church-bell-single-toll-heavy-iron.mp3, /cdn/moodboard-gothic-horror/sfx-ghostly-woman-sigh-whisper-reverb-far.mp3]
    crypt: [/cdn/moodboard-gothic-horror/sfx-heavy-stone-slab-grinding-far-in-crypt-reverb.mp3, /cdn/moodboard-gothic-horror/sfx-distant-chains-rattling-dungeon-reverb.mp3, /cdn/moodboard-gothic-horror/sfx-ghostly-woman-sigh-whisper-reverb-far.mp3, /cdn/moodboard-gothic-horror/sfx-bones-clattering-far-off-crypt.mp3]
    fen: [/cdn/moodboard-gothic-horror/sfx-marsh-bird-eerie-cry-over-water.mp3, /cdn/moodboard-gothic-horror/sfx-big-bubble-burst-mud-plop.mp3]
    coast: [/cdn/moodboard-painterly-fantasy/sfx-ship-bell-ringing-far-out-at-sea.mp3, /cdn/moodboard-painterly-fantasy/sfx-hawk-cry-high-overhead-open-sky.mp3]
    ember: [/cdn/moodboard-painterly-fantasy/sfx-distant-rockfall-rumble-mountain.mp3, /cdn/moodboard-painterly-fantasy/sfx-distant-rockfall-rumble-mountain.mp3]
    frost: [/cdn/moodboard-painterly-fantasy/sfx-distant-rockfall-rumble-mountain.mp3, /cdn/moodboard-painterly-fantasy/sfx-distant-wolf-howl-echoing-through-forest.mp3]
    desert: [/cdn/moodboard-painterly-fantasy/sfx-distant-rockfall-rumble-mountain.mp3, /cdn/moodboard-painterly-fantasy/sfx-hawk-cry-high-overhead-open-sky.mp3]
    arcane: [/cdn/moodboard-gothic-horror/sfx-ghostly-woman-sigh-whisper-reverb-far.mp3, /cdn/moodboard-gothic-horror/sfx-distant-church-bell-single-toll-heavy-iron.mp3]
    drownedbell: [/cdn/moodboard-gothic-horror/sfx-distant-church-bell-single-toll-heavy-iron.mp3, /cdn/moodboard-gothic-horror/sfx-distant-chains-rattling-dungeon-reverb.mp3]
    palechoir: [/cdn/moodboard-gothic-horror/sfx-ghostly-woman-sigh-whisper-reverb-far.mp3, /cdn/moodboard-gothic-horror/sfx-distant-church-bell-single-toll-heavy-iron.mp3]
    rootarchive: [/cdn/moodboard-painterly-fantasy/sfx-branch-snapping-deep-in-woods-far.mp3, /cdn/moodboard-gothic-horror/sfx-heavy-stone-slab-grinding-far-in-crypt-reverb.mp3]
# a short sting when you cross into an area (region-music.js zoneSting); discover = the first time ever
zoneSting:
  enter: /cdn/moodboard-painterly-fantasy/music-short-zone-entry-sting-soft-harp-arpeggio-warm-strings-two-seconds.mp3
  discover: /cdn/moodboard-painterly-fantasy/music-short-new-area-discovered-fanfare-rising-strings-french-horn-chime-four-seconds.mp3
