# One theme per area. scripts/region-music.js plays the row for where each player stands, to that player alone.
# Region ids come from scripts/lib/regions.js. A region not listed plays `wilds`.
volume: 0.25          # times the player's own music volume (state.musicVolume, default 1)
fade: 3.5             # seconds of crossfade when you walk into a new area
themes:
  menu: /cdn/moodboard-painterly-fantasy/music-majestic-fantasy-main-theme-solo-horn-rising-strings-choir-swell-loop.mp3
  creation: /cdn/moodboard-painterly-fantasy/music-gentle-hopeful-fantasy-harp-celesta-soft-strings-hero-awakening-loop.mp3
  reach: /cdn/moodboard-painterly-fantasy/music-warm-medieval-village-lute-recorder-hand-drum-afternoon-loop.mp3
  forest: /cdn/moodboard-painterly-fantasy/music-enchanted-forest-wooden-flute-plucked-harp-mysterious-strings-loop.mp3
  coast: /cdn/moodboard-painterly-fantasy/music-seaside-folk-accordion-fiddle-gentle-waves-sea-shanty-calm-loop.mp3
  fen: /cdn/moodboard-painterly-fantasy/music-eerie-misty-swamp-low-cello-drones-distant-chimes-melancholy-loop.mp3
  ember: /cdn/moodboard-painterly-fantasy/music-heroic-dwarven-forge-deep-brass-war-drums-anvil-hits-loop.mp3
  arcane: /cdn/moodboard-painterly-fantasy/music-ancient-arcane-ruins-ethereal-choir-glass-harmonica-slow-pads-loop.mp3
  wilds: /cdn/music-instrumental-fantasy-adventure-orchestral.mp3
  ashen: /cdn/moodboard-gothic-horror/music-ashen-close-graveyard-dark-gothic-solo-cello-music-box-distant-church-bell-dread-loop.mp3
  frost: /cdn/moodboard-painterly-fantasy/music-frozen-mountain-pass-lonely-low-horn-icy-glass-pads-slow-taiko-wind-loop.mp3
  desert: /cdn/moodboard-painterly-fantasy/music-scorched-ash-desert-duduk-lament-frame-drum-low-drone-heat-haze-loop.mp3
  battle: /cdn/moodboard-painterly-fantasy/music-tense-fantasy-battle-war-drums-low-brass-staccato-strings-loop.mp3
  crypt: /cdn/moodboard-gothic-horror/music-hollowcrypt-candlelit-vault-low-choir-slow-bells.mp3
  drownedbell: /cdn/moodboard-gothic-horror/music-drowned-bell-underwater-choir-muffled-bells-slow-dread-loop.mp3
  rootarchive: /cdn/moodboard-painterly-fantasy/music-root-archive-ancient-underground-forest-low-woodwinds-heartbeat-drum-loop.mp3
  palechoir: /cdn/moodboard-gothic-horror/music-pale-choir-raid-cathedral-organ-dark-choir-epic-loop.mp3
  emberheart: /cdn/moodboard-painterly-fantasy/music-emberheart-caldera-raid-volcanic-war-drums-brass-choir-epic-loop.mp3
  assembly: /cdn/moodboard-painterly-fantasy/music-assembly-of-the-ninth-finale-cosmic-choir-strings-bells-epic-loop.mp3
combat: { holdSeconds: 10, radius: 35, fade: 1.2 }   # battle theme while you strike or are struck, then back
places:
  main-menu-land: menu
  main-menu: menu
  character-creation-land: creation
  hollowcrypt: crypt
  drowned-bell: drownedbell
  root-archive: rootarchive
  pale-choir: palechoir
  emberheart: emberheart
  ninth-assembly: assembly
regions:
  reach: reach
  ashen: ashen
  farm: reach
  briarwild: forest
  petalfall: forest
  deepgrove: forest
  deepwood: forest
  elderveil: forest
  thornhollow: forest
  reedhaven: fen
  starfall: arcane
  saltmere: coast
  gullrest: coast
  tideglass: coast
  sea: coast
  sorrowfen: fen
  quarry: ember
  highlands: ember
  cinderhold: ember
  ashfall: desert
  sunscar: desert
  spire: arcane
  ninthveil: arcane
  hollowcrypt: crypt
  greyspine: frost
  frostveil: frost

# Ambient beds: each player hears the bed of the area they stand in, under the music (player.ambience, per player).
# A key is a theme id (the area's music row) or a place name; places win.
ambience:
  menu: null
  creation: null
  reach: /cdn/moodboard-painterly-fantasy/sfx-village-afternoon-ambience-distant-chickens-hammer-on-anvil-birdsong-murmur-loop.mp3
  forest: /cdn/moodboard-painterly-fantasy/sfx-deep-forest-ambience-wind-in-pine-canopy-creaking-branches-woodpecker-birds-loop.mp3
  coast: /cdn/moodboard-painterly-fantasy/sfx-coast-ambience-waves-on-shingle-beach-gulls-wind-rigging-creak-loop.mp3
  fen: /cdn/moodboard-gothic-horror/sfx-swamp-ambience-frogs-croaking-bubbling-mud-insects-buzzing-still-water-loop.mp3
  ember: /cdn/moodboard-painterly-fantasy/sfx-volcanic-highland-ambience-low-rumble-hissing-steam-vents-crackling-embers-loop.mp3
  arcane: /cdn/moodboard-painterly-fantasy/sfx-ancient-ruins-ambience-high-wind-faint-crystal-hum-whispering-echoes-loop.mp3
  wilds: /cdn/moodboard-painterly-fantasy/sfx-open-grassland-ambience-gentle-wind-through-tall-grass-crickets-distant-birds-loop.mp3
  ashen: /cdn/moodboard-gothic-horror/sfx-graveyard-ambience-cold-wind-crows-cawing-creaking-iron-gate-dry-leaves-loop.mp3
  frost: /cdn/moodboard-painterly-fantasy/sfx-mountain-blizzard-ambience-howling-wind-snow-hiss-ice-creak-loop.mp3
  desert: /cdn/moodboard-painterly-fantasy/sfx-ash-desert-ambience-hot-dry-wind-sand-hiss-distant-thunder-rumble-loop.mp3
  crypt: /cdn/moodboard-gothic-horror/sfx-dungeon-crypt-ambience-dripping-water-distant-chains-low-stone-groan-loop.mp3
  drownedbell: /cdn/moodboard-gothic-horror/sfx-flooded-catacomb-ambience-dripping-echoing-water-slosh-muffled-bell-loop.mp3
  rootarchive: /cdn/moodboard-painterly-fantasy/sfx-underground-root-cavern-ambience-creaking-roots-soil-trickle-low-heartbeat-loop.mp3
  palechoir: /cdn/moodboard-gothic-horror/sfx-cathedral-ruin-ambience-cold-wind-through-broken-windows-faint-ghostly-choir-loop.mp3
