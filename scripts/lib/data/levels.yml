# Levels 1–60. xp is the TOTAL a hero has earned (state.xp stays cumulative; the HUD shows the part inside the current level).
# Anchors follow level_progression_1_to_60.json's bands against the quest XP that exists: origin (≈450 XP) ends near 5,
# Q001–Q008 + class arc near 10, EQU near 16, DHC near 20, SOR near 24, TID near 30. Between anchors the cost is smoothed;
# past 30 each level costs 9% more than the last. Tune here only.
anchors: { 1: 0, 5: 420, 8: 1650, 11: 2900, 16: 5500, 20: 8000, 24: 15000, 30: 27000, 31: 31000, 38: 70000, 45: 112000, 52: 158000, 60: 222000 }
# 31–60 (2026-10-08): Velthraen ≈ 37k, Bastion ≈ 42k, Glassmere ≈ 47k, Ninth Veil ≈ 54k quest XP: finishing VEI-09 lands a hero at the cap, raid-ready.
growth: 1.09
cap: 60
perLevel: { health: 60, mana: 25 }   # added to the 1000 / 500 a level-1 hero starts with
base: { health: 1000, mana: 500 }
damagePerLevel: 0.08   # every class ability hits this much harder per level past 1 (level 21 = x2.6), matching health growth
