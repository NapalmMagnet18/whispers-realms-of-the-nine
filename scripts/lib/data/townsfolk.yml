  lines: [I need someone to align three star charts., I need someone to review a prophecy board., I need someone to activate two light relays.]
vel-leth:
  name: Magister Leth Sen
  lines: [I need someone to interview two order delegates., I need someone to host an open hearing.]
vel-arlo:
  name: Keeper Sen Arlo
  lines: [I need someone to infiltrate an eyrie vault.]
vel-vale:
  name: Sister Vale
  lines: [I need someone to visit the hidden observatory.]
bas-oren:
  name: Marshal Oren Flint
  lines: [I need someone to speak to the Bastion wardens., I need someone to rescue two workers trapped in a test cell.]
bas-yurra:
  name: Mason Yurra Flint-Eye
  lines: [I need someone to inspect the central forge., I need someone to place a full public list of costs in the forge.]
bas-nala:
  name: Regent Nala Vorn
  lines: [I need someone to choose to share evidence with the union or council first.]
bas-vale:
  name: Sister Vale
  lines: [I need someone to free three captive echoes from power conduits.]
bas-dren:
  name: Quartermaster Dren
  lines: [I need someone to read Mareth's contracts.]
bas-mira:
  name: Mira the Forgekeeper
  lines: [I need someone to activate three emergency vents.]
bas-mareth:
  name: Regent Mareth Sable
  lines: [I need someone to confront Mareth.]
gla-ossa:
  name: Curator Ossa
  lines: [I need someone to find three books with blank titles., I need someone to hear the testimony of two signatories., I need someone to take the missing last page.]
gla-vale:
  name: Sister Vale
  lines: [I need someone to search two marginalia trails., I need someone to defend the archive from three Court incursions.]
gla-leth:
  name: Magister Leth Sen
  lines: [I need someone to align three mirror stations., I need someone to reconstruct the nine clauses.]
gla-eda:
  name: Eda Sable (Echo)
  lines: [I need someone to ask Eda three questions.]
gla-arlo:
  name: Keeper Sen Arlo
  lines: [I need someone to open two prisoner records.]
vei-vale:
  name: Sister Vale
  lines: [I need someone to bring four consent tokens., I need someone to choose open witnessing or guarded stewardship as your public policy.]
vei-leth:
  name: Magister Leth Sen
  lines: [I need someone to visit four witness echoes.]
vei-arlo:
  name: Keeper Sen Arlo
  lines: [I need someone to follow an invisible causeway.]
vei-mareth:
  name: Regent Mareth Sable
  lines: [I need someone to witness the day Eda disappeared.]
vei-eda:
  name: Eda Sable (Echo)
  lines: [I need someone to bring Eda a free testimony form.]
vei-witness:
  name: The Ninth Witness
  lines: [I need someone to complete nine short witness checks.]
vei-oren:
  name: Marshal Oren Flint
  lines: [I need someone to disable three siphons.]

# ── Reedhaven Refuge and Starfall Eyrie
iona:
  name: Reedkeeper Iona Sedge
  lines: [A name in the hand is easier than a name in the throat., The fen forgives slowly. So do I. But we both do., Every knot on the roll was tied by someone who loved them.]
kele:
  name: Wisp Tender Kele
  lines: [They're not spirits. Not exactly. They're what's left when someone was very loved., Never shut the lantern on one. Never., The big one by the pool is called Nettle. She bites. Not really.]
pell:
  name: Marsh Guide Pell
  lines: [Step where the poles say. Not where it looks firm. It always looks firm., I've pulled eleven people out of that mire. Twelve if you count the goat., Fen's moving again. It does that when the bell rings in the Reach.]
neris:
  name: Astromer Neris Sol
  lines: [The sky does not lie. Charts do., Eight lamps. Nine places. Count them yourself., Patience is the instrument. The telescope is just brass.]
ires:
  name: Glidewarden Ires
  lines: ['Feel that? Updraft. The mountain breathing.', 'First you walk. Then you fly. Then you learn to land, which is the hard part.', Mind the span in a crosswind.]
otho:
  name: Star Reader Otho
  lines: [I don't need my eyes to know the ninth place is dark. I remember when it wasn't., Write it down. Memory is a liar with good intentions., 'The rune moves east. Everything moves east, toward the bell.']
garrick:
  name: Garrick Steelweather, Armourer
  lines:
    - "Plate's not made, it's argued with. Every dent on that iron stand is a disagreement I won."
    - "The gilded set? Commissioned by a lord who died before the last fitting. It waits for a better pair of shoulders."
    - "Warden plate's blackened on purpose. Lamplight slides off it. In the Ashen Close, that matters."
    - "Mira keeps the old forge. I keep this one. We both keep score."
pip:
  name: Pip, the Armourer's Apprentice
  lines:
    - "Fourteen hundred turns of this wheel today. I counted. Master Garrick says counting's for people who aren't sharpening."
    - "That staff with the blue stone hums at night. I'm not supposed to touch it. I have not touched it. Much."
    - "One day I'll forge a blade with my name on the tang. Small letters. So it's humble."
wenna:
  name: Dame Wenna Harlow
  lines:
    - "I rode with the March Wardens nine summers. The kite shield on that wall? I carried its twin."
    - "Never buy plate in a hurry. Buy it the way you'd pick a horse: watch how it moves."
    - "If you're bound for the Drowned Bell, take something that doesn't rust. The water there remembers iron."
ysolde:
  name: Old Ysolde, Fen Apothecary
  lines:
    - "Green one's for wounds, blue one's for the head, red one's for when you've made a choice you regret. Don't mix them."
    - "Everything in the fen heals something, child. The trick is learning what it poisons first."
    - "Iona keeps the pool. I keep the cures. Between us, the Refuge keeps breathing."
    - "That cauldron's been on the boil since before your grandmother's grandmother. Don't let it go cold on my watch."
