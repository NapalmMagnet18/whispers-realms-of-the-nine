# The townsfolk of Lantern's Reach: E talks (scripts/quest-player.js), each press the next line. A new resident is a
# row here plus a placement tagged npc + talker with state.who = the row's key (scripts/townsfolk.js turns and greets).
sayLength: 7          # seconds a line stands over their head
mira:
  name: Mira the Forgekeeper
  lines:
    - "Mind the sparks, friend. Bring me copper from Emberstone Quarry, out past the east gate, and I'll show you what this anvil can sing."
    - "My father forged the lantern hooks on every lane of the Reach. Forty winters, and not one has rusted through."
    - "Elric at the west gate needs timber more than he'll admit. Help him, come back with calluses, and I'll respect them."
dren:
  name: Quartermaster Dren
  lines:
    - "Quartermaster Dren, at your service, and at your purse's. Wolf pelts, copper, good oak: I buy all three."
    - "The bank's just south-west of my stall. Keep your coin there; Briarwild wolves don't take coin, but they take everything else."
    - "Rope, bandages, a decent torch. Never cross the river with less. Trust an old soldier."
bram:
  name: Bram Alder
  lines:
    - "Bram Alder, carpenter. Every beam in this townhouse came out of the Briarwild, and I'd know each one by its grain."
    - "The stable by the east gate? My work too. Lean on the stall rails; they'll hold a horse in a temper."
    - "Bring me straight oak someday. Elric's errand will teach your arms the axe first: west gate, can't miss him."
tamsin:
  name: Tamsin the Ranger
  lines:
    - "That treeline is the Briarwild. Pretty from here. Less pretty after dark, when the wolves start counting."
    - "Follow the road west to Rowan's bridge and keep the river at your back. The den lies past the twisted oaks."
    - "One howl, fine. Three answering? Walk back. Slowly. Don't give them a reason to run."
vale:
  name: Sister Vale
  lines:
    - "Light keep you, traveller. The inn's hearth has burned since the Reach was founded; sit by it a while."
    - "They say the old cathedral spire, far to the north, still rings on still nights. I've heard it. Once."
    - "Rest is no weakness. The cider inside is honest, and the beds forgive a long day on the road."
rowan:
  name: Rowan the Ferryman
  lines:
    - "Ferryman by title, bridge-keeper by trade. The river ate my boat years back, so the town built me this bridge instead."
    - "West bank's the Briarwild. Keep to the path; the moss hides roots that'll snap an ankle clean."
    - "Copper glints east, timber groans west, and the water just keeps on south to the sea. Me, I watch it go."
ysolde:
  name: Warden Ysolde
  lines:
    - "The Veil thins every night. Something on the other side is listening."
    - "I keep the last fire before the world ends. Warm your hands, then tell me why you came this far north."
    - "The gate was broken before the Reach had a name. We don't mend it. We watch it."
maelis:
  name: Sister Maelis
  lines:
    - "These crystals hum in the nine tones. Eight we know."
    - "Lay your palm on one at dusk. If it hums back, it has learned your name. Try not to let it."
    - "The runes on the obelisks are a warning, not a welcome. I've translated three words: 'stay', 'close', 'listening'."
kestrel:
  name: Kestrel the Scout
  lines:
    - "Past the arch, the ground stops making sense. Don't go alone."
    - "I've seen rocks float up off that ridge like bubbles from a pond. They never come down."
    - "Need to get out fast? The roostmaster's gryphon will take you south. Just don't look back at the gate when you lift off."
brannoc:
  name: Forgemaster Brannoc
  lines:
    - "Every blade in the March was born in these fires, or wishes it had been."
    - "The Stonewrought set the first stone of this keep on a river of fire. It has never once gone cold."
    - "Those two at the gate? Our first smiths. We carved them so they'd never have to stop watching."
hilde:
  name: Ashwarden Hilde
  lines:
    - "The mountain breathes. When it holds its breath, run."
    - "Walk the bridge, not the crust. The black skin on the lava lies about how thick it is."
    - "Ash on the wind means the shelves are waking. Ash in your boots means you stood still too long."
toma:
  name: Toma the Apprentice
  lines:
    - "Bring me ore from the shelves and I'll show you real steel."
    - "Master Brannoc says I hammer like a woodpecker. Fast, he means. I'm fairly sure he means fast."
    - "Hold your hand over the channel a moment. Feel that? That's the whole Reaches, humming."
hesk:
  name: Hesk the Cobbler
  lines:
    - "Sixty years mending boots on Bellward Lane. The lane ends at Eleven. Always has. Don't ask me twice."
    - "Mind the furnace by the west wall. It smokes when nobody lights it."
pell:
  name: Widow Pell
  lines:
    - "I keep baking an extra loaf. A courier came for it, three days running. For Thirteen, he said."
    - "The bell rings thirteen some nights. Nobody else hears it."
dockwatch:
  name: Corin of the Dock Watch
  lines:
    - "River's quiet. Too quiet, for a river."
    - "Rowan counts the boats. I count the oars. Some nights they don't match."
fenna:
  name: Elder Fenna Rootwake
  lines:
    - "The dead are not made safer by frightening the living away from them. Let the children play."
    - "Every tree in the orchard holds a memory someone gave back. Some grow apples. One grows white blossoms in winter."
    - "Fire is the easy answer. A bowl of water and a patient listener is the harder one."
ell:
  name: Grove Singer Ell
  lines:
    - "I sing to the roots so they know someone is still listening. Lately they've started singing back."
    - "A record, not a guess. Write what they say, not what you wish they'd said."
tamsin_glade:
  name: Tamsin the Ranger
  lines:
    - "Thorns grown right through their coats. Not a sickness. Something's calling them."
    - "Spare what stops fighting. A beast that runs home tells you where home is."
maudry:
  name: Old Maudry
  lines:
    - "I was small when the First Silence fell. My mother covered my ears. I remember the quiet more than the bell."
    - "There was a road with blue shutters. I'm nearly sure of it. Walk with me to the stone and I'll tell you."
yurra:
  name: Mason Yurra Flint-Eye
  lines:
    - "A good chisel makes one note. Clean as rain on slate. Lately every strike in this quarry makes two."
    - "I keep a ledger of every seam we cut. Lately I've started keeping one of every voice that answers."
    - "We record the cost of every miracle before we accept another. Write that down, cutter."
kiv:
  name: Quarry Foreman Kiv
  lines:
    - "It's a fault in the stone. That's all. More cutting, less listening, and we make quota."
    - "The Guild holds the food vouchers. You want to argue with the wall, argue on your own time."
    - "...Fine. Yes. I heard it too. Don't tell the crews."
sena:
  name: Pilot Sena Wavebound
  lines:
    - "I can tell from a gull's flight whether a squall will last an hour or a day. I can't tell you why the tide runs inland."
    - "A true song of navigation carries travelers somewhere they can choose to stay. Remember that, deckhand."
    - "Write down what you see. Not what you hope. Not what you're afraid of."
ruun:
  name: Shellkeeper Ruun
  lines:
    - "Every shell keeps the last thing it heard. Put one to your ear. Go on."
    - "My grandmother sang a hymn with a hole in it. I thought she'd forgotten the verse. Now I think somebody made her."
    - "Glass that wasn't blown on this coast. Oars with no boat. A child counting. Tell me again I'm a mad old man."
sari:
  name: Netmaker Sari
  lines:
    - "Three days of empty nets. The fish aren't gone. They're all swimming the same way."
    - "Mind the cove rocks. They'll take a skiff's bottom and smile about it."
    - "My nephew mends nets like he's angry at them. You've steadier hands."
oren:
  name: Marshal Oren Flint
  lines:
    - "A shield isn't a wall. It's a promise you make with your arm."
    - "Nine places at the Table. One stays bare. Ask me why when you've earned the answer."
    - "Anyone can hold a line. Holding it for people who'll never thank you, that's the job."
hollis:
  name: Old Hollis
  lines:
    - "I obeyed. They told me to withdraw and I withdrew, and I've carried that order in my chest for thirty years."
    - "Captain Ide wouldn't sign it. A lord did. I watched her tear her own sleeve to bind a stranger's arm the same hour."
wenna:
  name: Wenna of the Lane
  lines:
    - "I was nine. The soldiers walked away down the lane and nobody turned round. Except one. She came back."
    - "I don't want anyone hanged. I want it written down. That's all. Written down where people walk."
refugee:
  name: East-Road Traveler
  lines:
    - "Is it true the Reach still keeps its gate open? Even for folk like us?"
    - "We walked by night. The lanterns along the road kept us honest."
leth:
  name: Magister Leth Sen
  lines:
    - "Every lamp in this tower is listening to something. Most of them are listening to the truth."
    - "Quickly, before it learns your face. I say that about lamps and about students."
ossa:
  name: Curator Ossa
  lines:
    - "Don't breathe on the page. It remembers breath."
    - "Ink outlives the hand. That's the whole trouble with ink."
iona:
  name: Reedkeeper Iona Sedge
  lines:
    - "The reeds aren't cruel. They're just patient, and paths aren't."
    - "Red rag on a stake. Simplest map there is."
vale-crypt:
  name: Sister Vale
  lines:
    - "Breathe slow. The air is old but it's honest."
    - "Every candle here was lit for somebody. Some of them are still waiting for their name."
    - "If the Warden calls you 'witness', don't answer it with your name."
elric-crypt:
  name: Gatekeeper Elric
  lines:
    - "Thirty years I kept that gate and never asked what was under it."
    - "Keep your lamp low. The ink moves toward light."
    - "Whatever we find down here, the Reach is going to hear it. All of it."
pell-fen:
  name: Marsh Guide Pell
  lines:
    - "Step on the dark planks, not the green ones. The green ones are lying."
    - "Fog's late tonight. Good."
    - "Every lantern on this walk has a name in its wick. Mine's in the third one."
kele-fen:
  name: Wisp Tender Kele
  lines:
    - "Stand still. Let it come to you. That's the whole trick."
    - "A lost wisp hums. A tethered one only pulls."
iona-fen:
  name: Reedkeeper Iona Sedge
  lines:
    - "The reeds remember the shape of whoever walked through them last."
    - "Wenna's been coming to the pool for eleven years."
vale-fen:
  name: Sister Vale
  lines:
    - "Different dark from the crypt. Wetter. Same listening."
    - "The ledger led here. I wish it hadn't."
wenna-fen:
  name: Wenna the Mourner
  lines:
    - "Shh. They're nearly here. They always come at dusk."
    - "Look at the water, not at me."
