# Quests, keyed by id. Objectives count player.state.tally[key] from the moment of accept (baseline stored on accept).
# Rewards pay once: the claim writes completedQuests first and refuses when the id is already there.
# The Lantern's Reach chain (Quest Bible Q001-Q008, roadmap milestone 1). requires = every id done; requiresAny = one of.
# Objectives count player.state.tally keys: briar_wolf (wolves.js), log (woodcutting), and quest marks (objects tagged
# quest-mark, state.mark = the key) that E touches while their quest is active. The six origin finales that gate Q001 in
# the Bible (MAR-08 … VEY-08) are not built yet, so Q001 stands open to every hero for now.
# ── Marchfolk Origin: Names on a Census (Quest Bible MAR-01..MAR-08, zone Lantern Ward, levels 1-5) ──
# Lantern Ward is the walled outer quarter north of the Reach, astride the north road (centre 0,-100). Elric keeps
# both gates; Dren, Bram, Vale and Mira come out from the Reach. MAR-08 opens Q001 for Marchborn heroes (see origin).
MAR-01:
  id: MAR-01
  race: 0   # Marchborn origin only
  title: The Bell Before Dawn
  zone: Lantern Ward
  group: "Marchfolk Origin: Names on a Census"
  giverNpcId: gatekeeper-elric
  giverName: Gatekeeper Elric
  text: "Up before the bell, Marchborn? Good. The bell struck eight at noon yesterday. Every soul in the Ward is written on the census board by the gate. Go and find your own name on it. Tell me if anything there looks... wrong."
  progressText: "The census board stands by the north road, inside the Ward wall."
  turnInText: "Rubbed out past Eleven? Bellward Lane ends at Eleven. It always has. ...Then why do I know the next house had blue shutters? That's what frightens me."
  doneText: "Dren's short of hands this morning. Ask him at his rail by the west gate."
  refusedText: "You've read the board already, friend."
  objectives:
    - { key: census_board, desc: "Examine the Ward census board", target: 1 }
  rewards: { xp: 10, items: [starter_coat] }

MAR-02:
  id: MAR-02
  race: 0   # Marchborn origin only
  title: A Face in the Crowd
  zone: Lantern Ward
  group: "Marchfolk Origin: Names on a Census"
  requires: [MAR-01]
  giverNpcId: reach-npc-dren
  giverName: Quartermaster Dren
  text: "Elric sent you? Then earn your boots. Three parcels for the Ward, crates stacked at the doorsteps on Bellward Lane. And a courier's been trying to deliver bread to Number Thirteen for three days. Ask the neighbours about Thirteen. Nobody ever answers me straight."
  progressText: "Three parcels to the Ward doorsteps, and two neighbours asked about Number Thirteen."
  turnInText: "The cobbler described a whole family, then swore he never spoke. A house that isn't there, and people who remember its supper table. Here, your wages. And mind the coin: copper's how the March keeps its word."
  doneText: "Bram's been chalking walls up in the Ward. Find him by the Bell tower."
  refusedText: "Already paid you for those parcels."
  objectives:
    - { key: ward_parcel, desc: "Deliver supply parcels on Bellward Lane", target: 3 }
    - { key: ward_neighbour, desc: "Ask the neighbours about Number Thirteen", target: 2 }
  rewards: { copper: 120, xp: 25 }

MAR-03:
  id: MAR-03
  race: 0   # Marchborn origin only
  title: The Empty Door
  zone: Lantern Ward
  group: "Marchfolk Origin: Names on a Census"
  requires: [MAR-02]
  giverNpcId: reach-npc-bram
  giverName: Bram Alder
  text: "Children's chalk on the paving, arrows all the way down Bellward Lane. They end at the brick wall past Eleven, where there's a door that was bricked up before I was born. Follow them and try the handle. Tell me it's cold."
  progressText: "Chalk arrows in the Ward lead to the bricked door in the east wall. Check its latch."
  turnInText: "Warm. And a voice asked, polite as you please, if you'd leave the bread with a neighbour? The door opens inward... from a street we don't have. Keep this. A scrap of the old lamp that hung over it."
  doneText: "Sister Vale has been finding notices nailed up in the Ward. Speak with her."
  refusedText: "You've seen the door already."
  objectives:
    - { key: walled_door, desc: "Follow the chalk marks to the walled door", target: 1 }
    - { key: door_latch, desc: "Try the warm handle", target: 1 }
  rewards: { copper: 60, xp: 30, items: [lantern_scrap] }

MAR-04:
  id: MAR-04
  race: 0   # Marchborn origin only
  title: Three Names Too Few
  zone: Lantern Ward
  group: "Marchfolk Origin: Names on a Census"
  requires: [MAR-03]
  giverNpcId: reach-npc-vale
  giverName: Sister Vale
  text: "Lost-notices, nailed up in the Ward overnight. 'Have you seen...' and then a name nobody living knows. Bring me three, then read them against the bell roll at the foot of the tower. The bell roll names every soul it ever rang for."
  progressText: "Three lost notices in the Ward, then compare them with the bell roll at the tower."
  turnInText: "Eda Sable. The Sables of Number Thirteen. All on the bell roll, rung for on one night, the First Silence. And the notices are dated tomorrow. I'll keep a copy. You keep this note."
  doneText: "Elric wants the storm lamps lit before dusk. Go to him."
  refusedText: "You've brought me the notices already."
  objectives:
    - { key: lost_notice, desc: "Collect lost notices in the Ward", target: 3 }
    - { key: bell_roll, desc: "Compare them with the bell roll", target: 1 }
  rewards: { copper: 60, xp: 35, items: [archive_note] }

MAR-05:
  id: MAR-05
  race: 0   # Marchborn origin only
  title: Keep the Light
  zone: Lantern Ward
  group: "Marchfolk Origin: Names on a Census"
  requires: [MAR-04]
  giverNpcId: gatekeeper-elric
  giverName: Gatekeeper Elric
  text: "Something walks the Ward after the notices go up. Shapes. Light the two storm lamps on Bellward Lane, then stand at the bell rope. If the shapes come, steady them. Don't swing at them unless they swing first."
  progressText: "Two storm lamps on Bellward Lane, then steady the shades at the bell rope."
  turnInText: "They didn't fight you. They read you names. Names! ... Take this gear. If they ever do come with teeth, you'll want it."
  doneText: "Mira says the old Ward furnace has been smoking again. Go and see her."
  refusedText: "You kept the light already, friend."
  objectives:
    - { key: storm_lamp, desc: "Light the storm lamps", target: 2 }
    - { key: echo_shade, desc: "Defend the bell rope from the echo shades", target: 2 }
  rewards: { copper: 100, xp: 50, items: [ward_gloves] }

MAR-06:
  id: MAR-06
  race: 0   # Marchborn origin only
  title: A Ledger of Ash
  zone: Lantern Ward
  group: "Marchfolk Origin: Names on a Census"
  requires: [MAR-05]
  giverNpcId: reach-npc-mira
  giverName: Mira the Forgekeeper
  text: "The Ward's old furnace, by the west wall. Nobody's fired it in a hundred years, but there's fresh soot in the flue. Scrape me a sample, then find the brass maker's mark on its door. I want to know whose it was."
  progressText: "Soot from the old Ward furnace, then the maker's mark on its door."
  turnInText: "That's not ore soot. That's paper. Ink and vellum. And the mark is the old Beacon Guild seal. They didn't smelt in that furnace... they burned records in it."
  doneText: "Sister Vale will want to hear about that furnace. She's waiting."
  refusedText: "I've seen that soot, love."
  objectives:
    - { key: furnace_soot, desc: "Scrape soot from the old furnace", target: 1 }
    - { key: maker_mark, desc: "Uncover the brass maker's mark", target: 1 }
  rewards: { copper: 80, xp: 55, items: [furnace_soot] }

MAR-07:
  id: MAR-07
  race: 0   # Marchborn origin only
  title: No Grave, No Record
  zone: Lantern Ward
  group: "Marchfolk Origin: Names on a Census"
  requires: [MAR-06]
  giverNpcId: reach-npc-vale
  giverName: Sister Vale
  turnInNpcId: gatekeeper-elric
  turnInName: Gatekeeper Elric
  text: "Behind the Bell tower there's a plaque under the ivy. No grave, no names, only a date. Read it. Then take what you read to Elric. He signed the Ward orders the year that date was cut. He has to hear it from someone who isn't me."
  progressText: "Read the memorial plaque behind the Bell tower, then bring it to Elric."
  turnInText: "...I signed it. I was nineteen and the Guild said it was for a week. 'Seal the lane, keep the people safe.' Then the lane was gone and nobody remembered it. Not even me, until now. Take this token. You've earned the truth of it."
  doneText: "One more thing, Marchborn. The plaque. Someone has to decide what we do with it."
  refusedText: "You've told me already. I won't forget twice."
  objectives:
    - { key: memorial_plaque, desc: "Read the forgotten memorial plaque", target: 1 }
  rewards: { copper: 120, xp: 60, items: [lantern_token] }

MAR-08:
  id: MAR-08
  race: 0   # Marchborn origin only
  title: Open the Eastern Gate
  zone: Lantern Ward
  group: "Marchfolk Origin: Names on a Census"
  requires: [MAR-07]
  giverNpcId: gatekeeper-elric
  giverName: Gatekeeper Elric
  text: "The plaque is yours to decide. Set it up in the open for the whole Ward to read, or seal it in the archive chest for the scholars. Either way, it stays recorded. Then walk through into the Reach square. You're done being only a Ward child."
  progressText: "Choose the plaque's fate at the memorial, then walk into Lantern's Reach."
  turnInText: "Whatever you chose, it's written now. Truth can be kept, but not forever kept private. Welcome to the Reach, Marchborn. The road starts here."
  doneText: "Now. Before you go wandering, the Beacon Guild register."
  refusedText: "The gate's open for you already."
  objectives:
    - { key: memorial_choice, desc: "Choose: display or archive the memorial", target: 1 }
    - { key: reach_visits, desc: "Walk into Lantern's Reach", target: 1 }
  rewards: { copper: 200, xp: 80 }

THR-01:
  id: THR-01
  race: 1   # Briarkin (Thren) origin only
  title: A Seed Without Spring
  zone: Rootwake Glade
  group: "Thren Origin: The Root That Learned a Name"
  giverNpcId: glade-npc-fenna
  giverName: Elder Fenna Rootwake
  text: "Awake, little root? Good. The memory orchard dropped its seeds early this year, and they will not sleep. Gather three from the glade floor, then plant one at the witness stump by the shrine. Gently. A seed that remembers is still a seed."
  progressText: "Three memory seeds from the glade, one planted at the witness stump."
  turnInText: "It took. Look: a white root already, thin as a hair. By dusk it will have knuckles. ...Do not be afraid of it. Be patient with it."
  doneText: "Ell is singing by the old roots. Go and listen with her."
  refusedText: "Your seed is planted, child."
  objectives:
    - { key: memory_seed, desc: "Collect memory seeds from the glade", target: 3 }
    - { key: witness_stump, desc: "Plant one at the witness stump", target: 1 }
  rewards: { xp: 10, items: [root_seed] }

THR-02:
  id: THR-02
  race: 1   # Briarkin (Thren) origin only
  title: The Branch of Hands
  zone: Rootwake Glade
  group: "Thren Origin: The Root That Learned a Name"
  requires: [THR-01]
  giverNpcId: glade-npc-ell
  giverName: Grove Singer Ell
  text: "Three roots have come up shaped like hands. Five knuckles, pressed to the soil. The others want fire. I want a record. Kneel at each one and write down what it whispers. Exactly what it whispers, not what you think it meant."
  progressText: "Three hand-shaped roots around the glade. Kneel and listen at each."
  turnInText: "'Water.' 'Road.' 'Grandmother.' Three words, three hands. That is not a curse. That is someone trying to speak with the only mouth they have left."
  doneText: "Tamsin came up from the Reach this morning. She says the brambles are moving."
  refusedText: "You've written their words already."
  objectives:
    - { key: hand_root, desc: "Kneel and record a hand-shaped root", target: 3 }
  rewards: { xp: 40, copper: 30, items: [lore_glyph] }

THR-03:
  id: THR-03
  race: 1   # Briarkin (Thren) origin only
  title: Hungry Bark
  zone: Rootwake Glade
  group: "Thren Origin: The Root That Learned a Name"
  requires: [THR-02]
  giverNpcId: glade-npc-tamsin
  giverName: Tamsin the Ranger
  text: "Bramble-struck beasts on the east fence. Wolves with thorns grown right through their coats. Drive two of them off. And the third one, the quiet one by the fallen post? It's stopped fighting. Spare it. Calm it and let it go."
  progressText: "Drive off two bramble-struck beasts by the east fence, then calm the quiet one."
  turnInText: "You let it go. Good. They aren't wicked, they're following something. A pulse, like a bell too far off to hear. I'll be watching where they run."
  doneText: "Fenna's been asking for you."
  refusedText: "The fence is quiet now."
  objectives:
    - { key: bramble_beast, desc: "Drive off bramble-struck beasts", target: 2 }
    - { key: spare_beast, desc: "Calm the pacified beast and let it go", target: 1 }
  rewards: { xp: 60, copper: 50, items: [pathfinder_tonic] }

THR-04:
  id: THR-04
  race: 1   # Briarkin (Thren) origin only
  title: Gatherer of Last Words
  zone: Rootwake Glade
  group: "Thren Origin: The Root That Learned a Name"
  requires: [THR-03]
  giverNpcId: glade-npc-fenna
  giverName: Elder Fenna Rootwake
  text: "When a Thren dies, they give one memory back to the orchard, and the orchard writes it on a leaf. The storm scattered four of them. Find the leaf-notes, and lay them around the memorial bowl at the shrine. They should not lie alone in the mud."
  progressText: "Four leaf-notes scattered through the glade, laid around the memorial bowl."
  turnInText: "A baker's bread. A first snow. A song. ...And one I do not know: a road with blue-shuttered houses. No Thren ever lived on such a road."
  doneText: "Ell has found something under the oldest tree."
  refusedText: "The leaves are home."
  objectives:
    - { key: leaf_note, desc: "Collect fallen leaf-notes", target: 4 }
    - { key: memorial_bowl, desc: "Lay them around the memorial bowl", target: 1 }
  rewards: { xp: 60, items: [memory_leaf] }

THR-05:
  id: THR-05
  race: 1   # Briarkin (Thren) origin only
  title: The Root Below
  zone: Rootwake Glade
  group: "Thren Origin: The Root That Learned a Name"
  requires: [THR-04]
  giverNpcId: glade-npc-ell
  giverName: Grove Singer Ell
  text: "There's a hollow under the oldest tree, roots like a stair. Something down there glows when the bell rings in the Reach. Go down, find it, and cut it free without cutting a single root. If you wound the tree, we lose its voice."
  progressText: "The root hollow under the oldest tree. Cut the glowing thing free, roots unharmed."
  turnInText: "Bellglass. Here, in a Thren root. Someone grew it in on purpose, a long time ago, so the tree would ring when the bells did. A listening tree."
  doneText: "Fenna has to decide something. She wants you there."
  refusedText: "The shard is safe with you."
  objectives:
    - { key: root_tunnel, desc: "Descend into the root hollow", target: 1 }
    - { key: bellglass_shard, desc: "Cut the bellglass shard free", target: 1 }
  rewards: { xp: 70, copper: 60, items: [bellglass_shard] }

THR-06:
  id: THR-06
  race: 1   # Briarkin (Thren) origin only
  title: What We Do Not Burn
  zone: Rootwake Glade
  group: "Thren Origin: The Root That Learned a Name"
  requires: [THR-05]
  giverNpcId: glade-npc-fenna
  giverName: Elder Fenna Rootwake
  text: "The assembly is split. One keeper wants the singing tree's voice cried across the forest. Another wants the recording kept for the elders alone. I will not choose for you. Read both testimonies at the shrine and preserve one publicly. Then the rootblight is creeping at the new seedling. Protect it."
  progressText: "Choose a testimony at the shrine lecterns, then guard the seedling from rootblight."
  turnInText: "You chose, and you did not pretend the other choice was wicked. That is the whole of being an elder, child. The rest is just remembering birthdays."
  doneText: "Tamsin's waiting at the footbridge. An old woman wants to walk to the border."
  refusedText: "The testimony is kept."
  objectives:
    - { key: testimony_choice, desc: "Choose a testimony to preserve publicly", target: 1 }
    - { key: rootblight, desc: "Protect the seedling from rootblight", target: 1 }
  rewards: { xp: 80, items: [glade_charm] }

THR-07:
  id: THR-07
  race: 1   # Briarkin (Thren) origin only
  title: The Walk of Witnesses
  zone: Rootwake Glade
  group: "Thren Origin: The Root That Learned a Name"
  requires: [THR-06]
  giverNpcId: glade-npc-tamsin
  giverName: Tamsin the Ranger
  text: "The storm cracked the footbridge. Mend it. Then Old Maudry wants to walk to the border stone. She says she was there when the First Silence fell, and she wants to see the road out once more before she forgets it. Walk her there. Slowly."
  progressText: "Mend the footbridge, meet Old Maudry, and walk with her to the border waystone."
  turnInText: "She talked the whole way, didn't she? Good. Every word of it is a road someone can follow back."
  doneText: "Fenna. One more thing, and then the Reach."
  refusedText: "The bridge holds. Maudry's home."
  objectives:
    - { key: footbridge, desc: "Mend the woodland footbridge", target: 1 }
    - { key: old_witness, desc: "Meet Old Maudry at the shrine", target: 1 }
    - { key: border_stone, desc: "Walk with her to the border waystone", target: 1 }
  rewards: { xp: 90, copper: 120, items: [seed_sigil] }

THR-08:
  id: THR-08
  race: 1   # Briarkin (Thren) origin only
  title: Between Grove and Bell
  zone: Rootwake Glade
  group: "Thren Origin: The Root That Learned a Name"
  requires: [THR-07]
  giverNpcId: glade-npc-fenna
  giverName: Elder Fenna Rootwake
  text: "The roots spoke a name at last. Eda. Speak it over the stream so the water carries it, then take the road east to Lantern's Reach. Their beacon books may know where she lived. Carry the seed sigil. It turns toward the bell."
  progressText: "Speak the lost name over the stream, then travel to Lantern's Reach."
  turnInNpcId: gatekeeper-elric
  turnInName: Gatekeeper Elric
  turnInText: "A sigil that turns toward the bell. Fenna sent you, then. Eda... I know that name, and I wish I didn't. Rest, Briarkin. Lantern's Reach is yours to walk."
  doneText: "The Reach is east. Find Gatekeeper Elric."
  refusedText: "The road's open, child."
  objectives:
    - { key: stream_name, desc: "Speak the lost name over the stream", target: 1 }
    - { key: reach_visits, desc: "Travel to Lantern's Reach", target: 1 }
  rewards: { copper: 200, xp: 80 }

KHA-01:
  id: KHA-01
  race: 2   # Emberforged (Kharic) origin only
  title: First Chisel
  zone: Emberstone Cradle
  group: "Kharic Origin: The Quarry Has a Voice"
  giverNpcId: cradle-npc-yurra
  giverName: Mason Yurra Flint-Eye
  text: "New hands, and you haven't even got a chisel yet. Go and pull ore from the two copper seams past the rails, then bring it to the stump bench and mend that novice chisel. A cutter who can't mend her own tool can't be trusted with anyone else's."
  progressText: "Two seams of copper past the rails, then mend the chisel at the stump bench."
  turnInText: "Strike it on the bench. Hear that? Two notes. A chisel only rings once. Keep it close, and keep quiet about it for now."
  doneText: "Kiv wants a word. He always wants a word."
  refusedText: "That chisel's yours already."
  objectives:
    - { key: copper_node, desc: "Mine the copper seams", target: 2 }
    - { key: novice_chisel, desc: "Mend the novice chisel", target: 1 }
  rewards: { xp: 40, copper: 60, items: [training_chisel] }

KHA-02:
  id: KHA-02
  race: 2   # Emberforged (Kharic) origin only
  title: Stones That Should Be Silent
  zone: Emberstone Cradle
  group: "Kharic Origin: The Quarry Has a Voice"
  requires: [KHA-01]
  giverNpcId: cradle-npc-kiv
  giverName: Quarry Foreman Kiv
  text: "Pillars on the east cut are cracking and the crews say they hum. Stone doesn't hum. Look at the three cracked pillars, then take the tuning hammer off its stand and prove it, one way or the other. I've a quota to meet."
  progressText: "Inspect the three cracked pillars on the east cut, then strike them with the tuning hammer."
  turnInText: "Letters. You're telling me the cracks run in letters? In a script nobody alive can read? ...Don't put that in the shift log."
  doneText: "Dren's counting tokens and coming up short. Help him."
  refusedText: "You've done your looking."
  objectives:
    - { key: cracked_pillar, desc: "Inspect the cracked pillars", target: 3 }
    - { key: pillar_tone, desc: "Compare their tones with the tuning hammer", target: 1 }
  rewards: { xp: 55, copper: 80, items: [ore_chips] }

KHA-03:
  id: KHA-03
  race: 2   # Emberforged (Kharic) origin only
  title: The Closed Shift
  zone: Emberstone Cradle
  group: "Kharic Origin: The Quarry Has a Voice"
  requires: [KHA-02]
  giverNpcId: cradle-npc-dren
  giverName: Quartermaster Dren
  text: "Three brass shift tokens turned up in the spoil heaps. Stamped, numbered, Guild issue. Fetch them, then check them against the roster board. I'll pay for the tokens either way, but I'd like to know whose they are."
  progressText: "Find three shift tokens in the spoil, then check them against the roster board."
  turnInText: "Not on the roster. Not on any roster. A whole crew that was never paid, never fed, never counted. That isn't a clerk's error, friend."
  doneText: "Yurra's at the hall. Show her the tokens."
  refusedText: "Tokens are counted."
  objectives:
    - { key: shift_token, desc: "Recover the shift tokens", target: 3 }
    - { key: missing_crew, desc: "Count the missing miners on the roster", target: 1 }
  rewards: { xp: 60, copper: 150 }

KHA-04:
  id: KHA-04
  race: 2   # Emberforged (Kharic) origin only
  title: Resonance Underfoot
  zone: Emberstone Cradle
  group: "Kharic Origin: The Quarry Has a Voice"
  requires: [KHA-03]
  giverNpcId: cradle-npc-yurra
  giverName: Mason Yurra Flint-Eye
  text: "The old training tunnel under the west hall has two tuning stones. We used them to teach apprentices to hear a bad seam. Wake them both. If the floor answers, I want to know what it says."
  progressText: "Wake the two tuning stones by the west hall."
  turnInText: "Both stones, and the floor sang back in two voices. One of them was mine, from twenty years ago. I said those words on my first shift."
  doneText: "Mira's down from the Reach with her bellows. She wants to see what you dig up."
  refusedText: "The stones are awake."
  objectives:
    - { key: tuning_stone, desc: "Wake the tuning stones", target: 2 }
  rewards: { xp: 70, copper: 90, items: [tuning_stone] }

KHA-05:
  id: KHA-05
  race: 2   # Emberforged (Kharic) origin only
  title: The Lighter Vein
  zone: Emberstone Cradle
  group: "Kharic Origin: The Quarry Has a Voice"
  requires: [KHA-04]
  giverNpcId: cradle-npc-mira
  giverName: Mira the Forgekeeper
  text: "I came up from the Reach because they told me the bellglass here runs lighter than copper. Smelt me a bar at the forge, then set it beside the shard on the anvil horn. Tell me which one feels heavier in your hand."
  progressText: "Smelt a copper bar at the forge, then compare it with the bellglass shard."
  turnInText: "The glass. Of course the glass. It isn't ore, cutter. It's something said and never let out. Pressed down. Every cart they sell is somebody's held breath."
  doneText: "Kiv's shouting about the tunnel mouth again. Go."
  refusedText: "Bar's cooled."
  objectives:
    - { key: copper_bar, desc: "Smelt a copper bar", target: 1 }
    - { key: bellglass_compare, desc: "Compare it with the bellglass shard", target: 1 }
  rewards: { xp: 70, copper: 100, items: [novice_maul] }

KHA-06:
  id: KHA-06
  race: 2   # Emberforged (Kharic) origin only
  title: A Seal in the Wall
  zone: Emberstone Cradle
  group: "Kharic Origin: The Quarry Has a Voice"
  requires: [KHA-05]
  giverNpcId: cradle-npc-kiv
  giverName: Quarry Foreman Kiv
  text: "Scavengers came up out of the north tunnel mouth last night and they're digging where nobody ordered a dig. Drive three of them off, then find what they were after. If it's ore, it's the Guild's. If it isn't, it's Yurra's problem."
  progressText: "Drive off three scavengers at the north tunnel mouth, then recover what they uncovered."
  turnInText: "Nine points. Rusted shut, and somebody hammered it shut from the outside. That sealed cut runs toward the old crypt road. ...It's Yurra's problem."
  doneText: "Yurra's at the lintel stones. She asked for you by name."
  refusedText: "The tunnel's quiet."
  objectives:
    - { key: tunnel_scavenger, desc: "Drive off the tunnel scavengers", target: 3 }
    - { key: old_seal, desc: "Recover the old seal", target: 1 }
  rewards: { xp: 90, copper: 160, items: [rust_seal] }

KHA-07:
  id: KHA-07
  race: 2   # Emberforged (Kharic) origin only
  title: Honest Stone
  zone: Emberstone Cradle
  group: "Kharic Origin: The Quarry Has a Voice"
  requires: [KHA-06]
  giverNpcId: cradle-npc-yurra
  giverName: Mason Yurra Flint-Eye
  text: "The ancestors sealed that chamber knowing someone was still inside. I won't open it and I won't pretend it isn't there. The new lintel by the hall is blank. Cut the names from the tokens into it. Leave space. There will be more."
  progressText: "Cut the lost miners' names into the new lintel by the hall."
  turnInText: "There. Not a monument. A beginning. Leave the chisel ringing when you go, so they know someone heard."
  doneText: "One more thing, and then the road."
  refusedText: "The names are cut."
  objectives:
    - { key: lintel_names, desc: "Cut the miners names into the lintel", target: 1 }
  rewards: { xp: 90, copper: 120, items: [chisel_of_witness] }

KHA-08:
  id: KHA-08
  race: 2   # Emberforged (Kharic) origin only
  title: Road to the Living Bell
  zone: Emberstone Cradle
  group: "Kharic Origin: The Quarry Has a Voice"
  requires: [KHA-07]
  giverNpcId: cradle-npc-yurra
  giverName: Mason Yurra Flint-Eye
  text: "Lay your old chisel on the shrine with the others. Then carry a copy of the marks west along the lantern road to Lantern's Reach. Sister Vale keeps the Accord books there. We record the cost of every miracle before we accept another. That's the vow."
  progressText: "Leave the novice chisel at the miners' shrine, then take the lantern road west to Lantern's Reach."
  turnInNpcId: gatekeeper-elric
  turnInName: Gatekeeper Elric
  turnInText: "Stone dust and a chisel-hand. Yurra's, aren't you? Bring those marks to Sister Vale when you're ready. Rest first. Lantern's Reach is yours to walk."
  doneText: "The Reach is west. Find Gatekeeper Elric."
  refusedText: "The road's open, cutter."
  objectives:
    - { key: shrine_chisel, desc: "Leave your chisel at the miners' shrine", target: 1 }
    - { key: reach_visits, desc: "Travel to Lantern's Reach", target: 1 }
  rewards: { copper: 200, xp: 80 }


# ── Namar Origin: Harbor of the Uncharted (Quest Bible NAM-01..NAM-08, Breakwater Strand at Gullrest, levels 1-5) ──
# Gullrest cove (start-gullrest 250,1430): Sena at the pier head, Ruun at the chart table, Sari at the net racks.
NAM-01:
  id: NAM-01
  group: "Namar Origin: Harbor of the Uncharted"
  zone: Breakwater Strand
  race: 3   # Saltborn (Namar) origin only
  title: Tide on the Wrong Hour
  giverNpcId: strand-npc-sena
  giverName: Pilot Sena Wavebound
  text: "The tide came in at noon and went out at dusk. Wrong hour, both times. Read the three tide posts along the strand for me, then stand at the pier end and watch which way the current runs. Write what you see, not what you expect."
  progressText: "Read the three tide posts on the strand, then watch the current from the pier end."
  turnInText: "Inland. The water's running inland, toward the orchards. Keep that chart. You'll want it before the week's out."
  doneText: "Ruun's been hearing things in his shells. Humour him."
  refusedText: "You've read the posts. They won't change their minds for you."
  objectives:
    - { key: tide_mark, desc: "Read the tide posts", target: 3 }
    - { key: reversed_current, desc: "Watch the current from the pier end", target: 1 }
  rewards: { xp: 40, copper: 60, items: [tide_chart] }

NAM-02:
  id: NAM-02
  group: "Namar Origin: Harbor of the Uncharted"
  zone: Breakwater Strand
  race: 3   # Saltborn (Namar) origin only
  requires: [NAM-01]
  title: A Shell That Answered
  giverNpcId: strand-npc-ruun
  giverName: Shellkeeper Ruun
  text: "Shells keep the last sound they heard. Usually that's surf. Lately it's oars. Bring me four that still hum from the tideline, then put your ear to the great conch on my stand and tell me I'm a mad old man."
  progressText: "Gather four humming shells from the tideline, then listen through the great conch."
  turnInText: "Oars. Rope on cleats. A child counting. You heard it too. Then I'm not mad, or we both are. Keep the token."
  doneText: "Sena's worried about the lighthouse. Go to her."
  refusedText: "The conch has said what it has to say."
  objectives:
    - { key: shell_echo, desc: "Gather humming shells", target: 4 }
    - { key: hollow_conch, desc: "Listen through the great conch", target: 1 }
  rewards: { xp: 45, copper: 60, items: [conch_token] }

NAM-03:
  id: NAM-03
  group: "Namar Origin: Harbor of the Uncharted"
  zone: Breakwater Strand
  race: 3   # Saltborn (Namar) origin only
  requires: [NAM-02]
  title: The False Beacon
  giverNpcId: strand-npc-sena
  giverName: Pilot Sena Wavebound
  text: "Our light sweeps inland now. Every night, out of the empty fields, a harbor answers it. Go up to the lighthouse and see what's under the lens, then relight the two coast lamps so the fishing boats have something honest to steer by."
  progressText: "Inspect the lighthouse, then relight the two coast lamps."
  turnInText: "A hymn with a verse cut out of it. Cut, not torn. Somebody wanted a harbor forgotten and knew exactly which words held it."
  doneText: "Sari's nets came up empty again. She could use hands."
  refusedText: "The lamps are lit. Thank you."
  objectives:
    - { key: false_beacon, desc: "Inspect the lighthouse lens", target: 1 }
    - { key: coast_lamp, desc: "Relight the coast lamps", target: 2 }
  rewards: { xp: 50, copper: 70, items: [lantern_oil] }

NAM-04:
  id: NAM-04
  group: "Namar Origin: Harbor of the Uncharted"
  zone: Breakwater Strand
  race: 3   # Saltborn (Namar) origin only
  requires: [NAM-03]
  title: The Nets Are Empty
  giverNpcId: strand-npc-sari
  giverName: Netmaker Sari
  text: "Three days, empty nets. The fish are all swimming one way, same as the water. Take a line off the pier end and catch me two reef fish so I know they're still out there. And somebody's skiff is jammed on the rocks in the cove. Get it loose before the tide turns. Whichever way it turns."
  progressText: "Catch two reef fish from the pier end, then free the skiff jammed in the cove."
  turnInText: "Two fish, both facing inland in the bucket. Even dead. ...Keep the kit. You've a better hand for it than my nephew."
  doneText: "Ruun found glass in the old wreck. He wants it washed."
  refusedText: "Nets are mended. Thank you."
  objectives:
    - { key: reef_fish, desc: "Catch reef fish", target: 2 }
    - { key: trapped_skiff, desc: "Free the trapped skiff", target: 1 }
  rewards: { xp: 55, copper: 80, items: [fishing_kit_namar] }

NAM-05:
  id: NAM-05
  group: "Namar Origin: Harbor of the Uncharted"
  zone: Breakwater Strand
  race: 3   # Saltborn (Namar) origin only
  requires: [NAM-04]
  title: Salt Against Glass
  giverNpcId: strand-npc-ruun
  giverName: Shellkeeper Ruun
  text: "The wreck on the south rocks. Nobody remembers her name, which is its own kind of answer. There's glass in her bilge, blue, that wasn't blown on this coast. Bring a piece out, then wash it in the tide pool by the cottages. Salt shows what glass is hiding."
  progressText: "Recover glass from the south wreck, then wash it in the tide pool."
  turnInText: "Look at it in the light. Nine lines, etched from inside. A harbor chart, small as a thumbnail. Somebody made this to be found."
  doneText: "Sena's on the south strand. Something came up out of the water last night."
  refusedText: "The glass is clean. Keep it."
  objectives:
    - { key: wreck_glass, desc: "Recover glass from the wreck", target: 1 }
    - { key: tidal_wash, desc: "Wash the glass in the tide pool", target: 1 }
  rewards: { xp: 60, copper: 90, items: [washed_glass] }

NAM-06:
  id: NAM-06
  group: "Namar Origin: Harbor of the Uncharted"
  zone: Breakwater Strand
  race: 3   # Saltborn (Namar) origin only
  requires: [NAM-05]
  title: Songs of the Lost Fleet
  giverNpcId: strand-npc-sena
  giverName: Pilot Sena Wavebound
  text: "Three sailors washed up on the south strand at dawn, alive, and the water keeps standing up out of the surf to take them back. Drowned shapes, made of current. Drive them off. Then sit with the sailors. They're singing something, and I want the words."
  progressText: "Drive off the phantom currents on the south strand, then learn the sailors' refrain."
  turnInText: "'Between the ninth wave and the tenth, a harbor where the lost may rest.' That's the verse cut from our hymn. Word for word. Wear this. The coast should know you."
  doneText: "Ruun is making something. He asked for you by name."
  refusedText: "The sand's quiet now."
  objectives:
    - { key: phantom_current, desc: "Drive off phantom currents", target: 3 }
    - { key: harbor_refrain, desc: "Learn the harbor refrain", target: 1 }
  rewards: { xp: 70, copper: 100, items: [coast_mantle] }

NAM-07:
  id: NAM-07
  group: "Namar Origin: Harbor of the Uncharted"
  zone: Breakwater Strand
  race: 3   # Saltborn (Namar) origin only
  requires: [NAM-06]
  title: Compass for the Forgotten
  giverNpcId: strand-npc-ruun
  giverName: Shellkeeper Ruun
  text: "Wash-glass, a chart, and the verse. That's a compass, if you set it right. Build it on my table. Then the hard part: our pilots hid a route once, to keep people safe. Mark which old route you'd show the world. The compass doesn't care. We should."
  progressText: "Set the tideglass compass at Ruun's chart table, then choose which old route to mark."
  turnInText: "You chose. That's more than our grandparents did. Whatever comes of it, it's ours to answer for now, not a secret's."
  doneText: "Sena's waiting at the ferry buoys."
  refusedText: "The compass is set. Mind it."
  objectives:
    - { key: tideglass_compass, desc: "Set the tideglass compass", target: 1 }
    - { key: route_chosen, desc: "Choose a route to map", target: 1 }
  rewards: { xp: 70, copper: 110, items: [tideglass_compass] }

NAM-08:
  id: NAM-08
  group: "Namar Origin: Harbor of the Uncharted"
  zone: Breakwater Strand
  race: 3   # Saltborn (Namar) origin only
  requires: [NAM-07]
  title: A Road Made of Water
  giverNpcId: strand-npc-sena
  giverName: Pilot Sena Wavebound
  turnInNpcId: reach-npc-rowan
  turnInName: Rowan the Ferryman
  text: "The rivers are carrying what the coast can't hold anymore. Swim out through the ferry lane, buoy to buoy, so you know it by feel. Then go up the north road to Lantern's Reach. Rowan the Ferryman keeps the river landing there. Tell him Sena sent you, and tell him the Ninth Landing is real."
  progressText: "Pass the three ferry-lane buoys, then go north to Lantern's Reach and find Rowan the Ferryman at the docks."
  turnInText: "Sena sent you? Then she heard them too. ...The Ninth Landing. I've rowed past where it should be for thirty years. Rest, Saltborn. The Reach is yours, and I'll need your ears."
  doneText: "Gatekeeper Elric keeps the Reach's book of arrivals. Go and be written in."
  refusedText: "You've told me. I won't sleep tonight."
  objectives:
    - { key: ferry_lane, desc: "Pass the ferry-lane buoys", target: 3 }
    - { key: reach_visits, desc: "Travel to Lantern's Reach", target: 1 }
  rewards: { copper: 200, xp: 80 }

Q001:
  id: Q001
  origin: [{ race: 0, quest: MAR-08 }, { race: 1, quest: THR-08 }, { race: 2, quest: KHA-08 }, { race: 3, quest: NAM-08 }]   # Marchborn walk the Ward, Briarkin the Thren glade first; other peoples pass
  title: Welcome to Lantern's Reach
  giverNpcId: gatekeeper-elric
  giverName: Gatekeeper Elric
  text: "Another lantern on the road. Let me see your hand... aye, you carry the mark. Every one of them does, even folk from places I've never heard named. Before you go wandering, sign the Beacon Guild register by the quest board. The Reach keeps count of who walks its roads."
  progressText: "The register stands by the quest board, east of the well. Sign it, then come back to me."
  turnInText: "Signed in your own hand. Good. Now the Reach knows your name, and if you vanish, someone will notice. That matters more than you'd think, these days."
  doneText: "Tamsin's been asking for able hands. You'll find her by the stable."
  refusedText: "You're already on the register, friend."
  objectives:
    - { key: beacon_register, desc: "Sign the Beacon Guild register", target: 1 }
  rewards: { copper: 300, xp: 60, items: [training_blade] }

Q002:
  id: Q002
  title: A Light Against the Briars
  requires: [Q001]
  giverNpcId: reach-npc-tamsin
  giverName: Tamsin the Ranger
  text: "Elric sent you? Good. The Briar Wolves have grown bold past the river. They're chasing something, a pulse I can almost hear on still nights. Put down three of them and come back to me. No more than that. They're not the enemy, only frightened."
  progressText: "Three wolves, past Rowan's bridge to the west. Don't hunt the whole pack."
  turnInText: "Three. That's enough. Did you feel it out there, that ringing under the ground? Something's calling them. Something made of glass and bells."
  doneText: "Walk soft in the Briarwild. The wolves remember."
  refusedText: "You've already been paid for that one, friend!"
  objectives:
    - { key: briar_wolf, desc: Briar Wolves, target: 3 }
  rewards: { copper: 2500, xp: 150 }   # 25 silver

Q003:
  id: Q003
  title: The First Forge
  requires: [Q002]
  giverNpcId: reach-npc-mira
  giverName: Mira the Forgekeeper
  text: "Tamsin says you've steady hands. Prove it at my forge. Mine two lumps of copper at Emberstone Quarry, east along the road, smelt them into a bar at my forge, then hammer yourself a practice blade on the anvil. Everyone who works iron in the Reach starts the same way."
  progressText: "Two ore from the quarry, a bar at the forge, a blade on the anvil. In that order."
  turnInText: "Not bad for a first blade. Strange, though. When you struck it, the anvil rang twice, and I swear the second note said 'there should be nine.' Did you hear it too?"
  doneText: "Keep that blade. Your first one always means something."
  refusedText: "That blade's already been judged, friend."
  objectives:
    - { key: ore, desc: "Mine copper ore at Emberstone Quarry", target: 2 }
    - { key: forge_smelt, desc: "Smelt a bar at Mira's forge", target: 1 }
    - { key: forge_blade, desc: "Hammer a practice blade on the anvil", target: 1 }
  rewards: { copper: 800, xp: 120 }

Q004:
  id: Q004
  title: The Old River
  requires: [Q003]
  giverNpcId: reach-npc-rowan
  giverName: Rowan the Ferryman
  text: "You'll want to eat if you're to keep walking. Cast a line off the jetty past my bridge, catch two river fish, then cook a supper at the inn hearth. Bring word back to me. And while you're at it... ah, never mind. Old men see docks that aren't there."
  progressText: "Two fish off the western jetty, cooked at the inn hearth, then supper out to the dock watch."
  turnInText: "Smells right. Sit a moment. My ferry book lists a crossing last week, to a dock called the Ninth Landing. I've worked this river forty years. There is no Ninth Landing."
  doneText: "Mind the river. It remembers more than I do."
  refusedText: "You've had your supper, friend."
  objectives:
    - { key: fish, desc: "Catch river fish at the western jetty", target: 2 }
    - { key: cook_meal, desc: "Cook a supper at the inn hearth", target: 1 }
    - { key: dock_meal, desc: "Bring the supper to the dock watch", target: 1 }
  rewards: { copper: 700, xp: 120 }

Q005:
  id: Q005
  title: Supply the Watch
  requires: [Q004]
  giverNpcId: reach-npc-bram
  giverName: Bram Alder
  text: "The eastern watchtower's steps are rotting through. Chop me three oak logs from the stand past the river, then mend the steps at the tower's foot. I'd do it myself, but my back says otherwise."
  progressText: "Three oak logs, then the steps at the eastern watchtower."
  turnInText: "Steps are sound. But look what you dug up under the bottom tread: a waymark stone, old as the hills, carved with an arrow pointing east. Toward Hollowcrypt."
  doneText: "Good timber, good work. The watch thanks you."
  refusedText: "The steps are already mended, friend."
  objectives:
    - { key: log, desc: Oak Logs, target: 3 }
    - { key: watch_steps, desc: "Mend the eastern watchtower steps", target: 1 }
  rewards: { copper: 900, xp: 140 }

Q006:
  id: Q006
  title: Echoes at the Quarry
  requires: [Q005]
  giverNpcId: reach-npc-mira
  giverName: Mira the Forgekeeper
  text: "Scavengers have been picking over Emberstone Quarry, and the miners say the old bellglass lamp there has been smashed. Drive off three of those scavengers, recover the two crates they stashed, and look closely at that lamp. I want to know who broke it."
  progressText: "Two scavenger stashes and the broken bellglass lamp, all in the quarry."
  turnInText: "A maker's seal, fresh, pressed right over an Accord mark centuries old. The Hollow Court. They're signing their work now. That's not a good sign, friend."
  doneText: "Keep your eyes open in the quarry."
  refusedText: "You've already told me what you found."
  objectives:
    - { key: quarry_scavenger, desc: "Drive off quarry scavengers", target: 3 }
    - { key: quarry_stash, desc: "Recover scavenger stashes in the quarry", target: 2 }
    - { key: bellglass_lamp, desc: "Investigate the broken bellglass lamp", target: 1 }
  rewards: { copper: 1200, xp: 180 }

Q007:
  id: Q007
  title: Broken Sigil
  requires: [Q006]
  giverNpcId: reach-npc-vale
  giverName: Sister Vale
  text: "That seal Mira found is no accident. Three sigil stones were cast out of the Reach long ago: one by the windmill farm, one by Rowan's bridge, one on the old spire road north. Find them all, then set them in the witness recess beside me."
  progressText: "Three sigil stones: the farm, the bridge, the spire road. Then the recess."
  turnInText: "Listen. Each stone answers to a different voice, and none of them is yours or mine. No single hero can restore this inscription. It needs witnesses. It needs many."
  doneText: "The stones will wait. So will I."
  refusedText: "The stones are already set, child."
  objectives:
    - { key: sigil_stone, desc: "Find the three sigil stones", target: 3 }
    - { key: witness_recess, desc: "Set the stones in the witness recess", target: 1 }
  rewards: { copper: 1200, xp: 200 }

Q008:
  id: Q008
  title: The Hollowcrypt Gate
  requires: [Q007]
  giverNpcId: gatekeeper-elric
  giverName: Gatekeeper Elric
  turnInNpcId: reach-npc-vale
  turnInName: Sister Vale
  text: "Vale tells me the stones want witnesses. Then go and witness. Fly to Hollowcrypt Watch from the roost by the stable, find the old seal at the foot of the dead spire, and tell Sister Vale what it says."
  progressText: "The seal lies at the dead spire in Hollowcrypt Vale. Then bring word to Sister Vale."
  turnInText: "'The gate accepts witnesses, not owners.' So the first sealed district lies beneath us after all. You've done the Reach a great service. When you're ready, Hollowcrypt is open to you."
  doneText: "Hollowcrypt waits. Go with others if you can."
  refusedText: "You've already brought me the seal's words."
  objectives:
    - { key: hollowcrypt_seal, desc: "Inspect the Hollowcrypt seal", target: 1 }
  rewards: { copper: 2000, xp: 300 }

# Greeter quests: one per race start, claimed once. Given by the zone's greeter, turned in to Gatekeeper Elric at the Reach.
# reach_visits counts each time the hero walks into Lantern's Reach (quest-player.js), so the walk after accepting is the objective.
Q101:
  id: Q101
  title: Word for the Gatekeeper
  giverNpcId: start-thornhollow/start-thornhollow-greeter
  giverName: Elder Fennick Thornwhisper
  turnInNpcId: gatekeeper-elric
  turnInName: Gatekeeper Elric
  text: "The old trees have been whispering of wolves on the Briarwild road, sapling. Carry this acorn-sealed letter east along the lanterns to Gatekeeper Elric at Lantern's Reach. He will know what to make of it."
  progressText: "The Reach lies east, little sapling. Follow the lanterns."
  turnInText: "An acorn seal. Fennick's hand, I'd know it anywhere. Wolves on the Briarwild road... aye, that tallies with my watch. Welcome to the Reach, Briarkin."
  doneText: "Go well, sapling. The roots remember you."
  refusedText: "That letter's already been read, friend."
  objectives:
    - { key: reach_visits, desc: "Walk the lantern road to Lantern's Reach", target: 1 }
  rewards: { copper: 600, xp: 80 }

Q102:
  id: Q102
  title: Ash on the Wind
  giverNpcId: start-cinderhold/start-cinderhold-greeter
  giverName: Forgemother Brenna Ashvein
  turnInNpcId: gatekeeper-elric
  turnInName: Gatekeeper Elric
  text: "You're fresh from the anvil, ember-child, and already I've a task. Take this ash-sealed writ west down the lantern road to Gatekeeper Elric. Cinderhold stands with the Reach, and he should hear it from one of us."
  progressText: "West, ember-child, along the lanterns. Elric waits at the gate."
  turnInText: "A writ in Brenna's ash-seal. So Cinderhold stands with us. Good. The Reach is glad of Emberforged hands. Welcome."
  doneText: "Keep your fire banked, ember-child."
  refusedText: "That writ's already been read, friend."
  objectives:
    - { key: reach_visits, desc: "Walk the lantern road to Lantern's Reach", target: 1 }
  rewards: { copper: 600, xp: 80 }

Q103:
  id: Q103
  title: Salt and Lanternlight
  giverNpcId: start-gullrest/start-gullrest-greeter
  giverName: Old Maren Tidewell
  turnInNpcId: gatekeeper-elric
  turnInName: Gatekeeper Elric
  text: "Tide brought you, tide'll take you on, love. Before it does, run this salt-wrapped parcel north up the lantern road to Gatekeeper Elric. It's the gulls' word on the weather, and he's owed it."
  progressText: "North, love. The lantern road from the green, can't miss it."
  turnInText: "Salt-wrapped, smells of the bay. Maren's weather word, bless her. Storms off the Saltmere... I'll warn the watch. Welcome to the Reach, Saltborn."
  doneText: "Mind the nets, love."
  refusedText: "That parcel's already been opened, friend."
  objectives:
    - { key: reach_visits, desc: "Walk the lantern road to Lantern's Reach", target: 1 }
  rewards: { copper: 600, xp: 80 }

npc:
  talkReach: 3.5        # metres from Elric's feet that E talks
  greetReach: 7         # metres at which he salutes a passer-by
  greetCooldown: 20     # seconds between salutes
  sayLength: 5          # seconds a speech bubble stands

woodcutting:
  reach: 3              # metres from the oak's feet that E chops
  chopSeconds: 2.5      # one log
  swings: 3             # thunks per chop
  cancelMove: 1.2       # metres the chopper may drift before the chop stops
  logsPerTree: 3
  regrowSeconds: 30
  fallSeconds: 1.6      # the felled oak's tip-over
  fallAngle: 82         # degrees it lies at
  bagSlots: 30
  stackMax: 20
  chopSound: /cdn/moodboard-painterly-fantasy/sfx-axe-chop-wood.mp3
  fallSound: /cdn/moodboard-painterly-fantasy/sfx-tree-falling-crash.mp3

items:
  tide_chart: { id: tide_chart, name: Tide Chart, slot: bag, description: "The hours are written twice. One set runs backward." }
  conch_token: { id: conch_token, name: Conch Token, slot: bag, description: "Hold it to your ear: oars, faint and patient." }
  lantern_oil: { id: lantern_oil, name: Flask of Lantern Oil, slot: bag, description: "Whale-pale and slow-burning. Honest light." }
  fishing_kit_namar: { id: fishing_kit_namar, name: Sari's Fishing Kit, slot: bag, description: "Hooks, a line, a cork float carved like a gull." }
  washed_glass: { id: washed_glass, name: Washed Glass, slot: bag, description: "Blue tideglass, a nine-line harbor etched inside." }
  coast_mantle: { id: coast_mantle, name: Coast Mantle, slot: bag, description: "Salt-stiff oilcloth. The strand knows its wearer." }
  tideglass_compass: { id: tideglass_compass, name: Tideglass Compass, slot: bag, description: "Its needle points to a harbor no chart admits." }
  training_chisel: { id: training_chisel, name: Training Chisel, slot: bag, description: "Strike it once and it rings twice." }
  ore_chips: { id: ore_chips, name: Ore Chips, slot: bag, stackable: true, description: "Copper chips swept from the east cut. Some still hum." }
  tuning_stone: { id: tuning_stone, name: Tuning Stone, slot: bag, description: "A pocket of basalt that answers in a voice twenty years old." }
  novice_maul: { id: novice_maul, name: Cradle Novice Maul, slot: mainhand, description: "Mira's work: honest iron, no bellglass in it." }
  rust_seal: { id: rust_seal, name: Rust Seal, slot: bag, description: "Nine points, hammered shut from the outside." }
  chisel_of_witness: { id: chisel_of_witness, name: Chisel of Witness, slot: bag, description: "Plain iron. Room along the handle for names as they are found." }
  root_seed: { id: root_seed, name: Root Seed, slot: bag, description: "Warm as a hand. It turns in your palm toward water." }
  lore_glyph: { id: lore_glyph, name: Lore Glyph, slot: bag, description: "Three words in Ell's hand: water, road, grandmother." }
