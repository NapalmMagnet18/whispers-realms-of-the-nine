  trap_kit: { id: trap_kit, name: Trap Kit, slot: bag, description: "Snare wire, stakes, a little bell." }
  pathfinder_journal: { id: pathfinder_journal, name: Pathfinder Journal, slot: bag, description: "Tamsin's old report, and yours under it." }
