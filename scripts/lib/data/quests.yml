items:
  ward_reeve_mantle: {"id": "ward_reeve_mantle", "name": "Mantle of the Relit Ward", "slot": "chest", "ilvl": 32, "tier": "homecoming", "stats": {"power": 3, "stamina": 180}, "description": "Grey wool, lantern-thread at every seam. It is warm the way a kept promise is warm."}
  lantern_of_the_ward: {"id": "lantern_of_the_ward", "name": "Lantern-Key of the Ward", "slot": "amulet", "ilvl": 70, "tier": "homecoming", "stats": {"power": 6, "stamina": 320}, "description": "The old Ward gate key, hung on a lamp chain. The gate has not been locked since you came home."}
  hollowsong_bracers: {"id": "hollowsong_bracers", "name": "Bracers of the Mended Song", "slot": "hands", "ilvl": 32, "tier": "homecoming", "stats": {"power": 3, "stamina": 170}, "description": "Willow bark wound over leather. Hum and the grain hums back."}
  rootwake_seed: {"id": "rootwake_seed", "name": "Seed of the Ninth Grove", "slot": "amulet", "ilvl": 70, "tier": "homecoming", "stats": {"power": 6, "stamina": 320}, "description": "A seed from the Singing Tree, sealed in amber. It has already chosen where it will grow."}
  gharn_heartplate: {"id": "gharn_heartplate", "name": "Gharn-Banked Girdle", "slot": "belt", "ilvl": 32, "tier": "homecoming", "stats": {"power": 3, "stamina": 190}, "description": "A slag link from the brute's chain, cooled and banked. It keeps a forge's patience."}
  ninth_anvil_brand: {"id": "ninth_anvil_brand", "name": "Brand of the Ninth Anvil", "slot": "amulet", "ilvl": 70, "tier": "homecoming", "stats": {"power": 6, "stamina": 320}, "description": "A cooled brand from the Cradle forge, stamped with nine hammers. The ninth hammer is yours."}
  merrow_spyglass: {"id": "merrow_spyglass", "name": "Merrow’s Brass Spyglass", "slot": "offHand", "ilvl": 32, "tier": "homecoming", "stats": {"power": 3, "stamina": 170}, "description": "Barnacled, salt-fogged, still true. Look through it at the horizon and the horizon looks back, politely."}
  ninth_tide_pearl: {"id": "ninth_tide_pearl", "name": "Pearl of the Ninth Tide", "slot": "amulet", "ilvl": 70, "tier": "homecoming", "stats": {"power": 6, "stamina": 320}, "description": "Found where the Gull's Wake sank. It glows at low tide, which is when the drowned are listening."}
  unbraided_wraps: {"id": "unbraided_wraps", "name": "Rebraided Fen-Wraps", "slot": "legs", "ilvl": 32, "tier": "homecoming", "stats": {"power": 3, "stamina": 190}, "description": "Reed and river wool, every braid tied with a name. They never quite dry, and never get cold."}
  ninth_reed_knot: {"id": "ninth_reed_knot", "name": "The Ninth Knot", "slot": "amulet", "ilvl": 70, "tier": "homecoming", "stats": {"power": 6, "stamina": 320}, "description": "A single reed braid, nine strands. The ninth strand is a lantern-wick, still faintly lit."}
  starfall_circlet: {"id": "starfall_circlet", "name": "Circlet of the True Chart", "slot": "head", "ilvl": 32, "tier": "homecoming", "stats": {"power": 3, "stamina": 170}, "description": "Thin sky-iron set with a lens shard. Close your eyes and you still know where north is."}
  ninth_lamp_star: {"id": "ninth_lamp_star", "name": "Star of the Ninth Lamp", "slot": "amulet", "ilvl": 70, "tier": "homecoming", "stats": {"power": 6, "stamina": 320}, "description": "The ninth lamp on Otho's chart, made real in sky-glass. Every Veylori who sees it bows, a little."}
  marsh_reed_bundle: { id: marsh_reed_bundle, name: "Marsh Reed Bundle", slot: bag, description: "Three supple reeds, the first knot still in them." }
  lantern_net: { id: lantern_net, name: "Lantern Net", slot: bag, description: "A soft net that never closes. For wisps who want to come along." }
  wading_staff: { id: wading_staff, name: "Wading Staff", slot: bag, description: "White-tipped. It finds firm ground before your feet do." }
  woven_name_cord: { id: woven_name_cord, name: "Woven Name Cord", slot: bag, description: "A short braid of reed and thread, tied with one name you were told." }
  unbound_lantern: { id: unbound_lantern, name: "Unbound Lantern", slot: bag, description: "A plain lantern, door always open. A small wisp lives in it by choice." }
  river_map: { id: river_map, name: "River Road Map", slot: bag, description: "A road east to the Reach, and a street the Reach no longer has." }
  brass_lens: { id: brass_lens, name: "Brass Novice Lens", slot: bag, description: "Your first lens. It shows nine places where the charts show eight." }
  glider_ribbon: { id: glider_ribbon, name: "Glider Ribbon", slot: bag, description: "Ires ties one on every novice who crosses the span." }
  star_iron_chip: { id: star_iron_chip, name: "Star-Iron Chip", slot: bag, description: "Pitted, faintly warm, honest." }
  rune_chalk: { id: rune_chalk, name: "Rune Chalk", slot: bag, description: "Blue chalk that glows when a sky-rune passes overhead." }
  eyrie_charm: { id: eyrie_charm, name: "Eyrie Charm", slot: bag, description: "A tiny brass telescope on a cord." }
  ninth_star_chart: { id: ninth_star_chart, name: "Ninth-Star Chart", slot: bag, description: "Otho's true chart: nine lamps, the ninth drawn plain." }
  rootway_key: { id: rootway_key, name: Rootway Key, slot: bag, description: "A knot of living root that loosens when the right hand holds it." }
  nature_ward: { id: nature_ward, name: Nature Ward, slot: neck, description: "Thorn and willow braided by Ell. The brambles let its wearer pass." }
  living_inscription: { id: living_inscription, name: Living Inscription, slot: bag, description: "A rubbing of bark letters. The name in it is still growing." }
  seed_elixir: { id: seed_elixir, name: Seed Elixir, slot: bag, description: "Sap of a healthy heart-root, bottled. Smells of rain on moss." }
