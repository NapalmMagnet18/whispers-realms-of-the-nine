  childs_testimony: { id: childs_testimony, name: "Child's Testimony", slot: bag, description: "Eda's words, pressed in a leaf: I am not anyone's banner." }
  lockpick_roll: { id: lockpick_roll, name: Lockpick Roll, slot: bag, description: "Seven picks in oilcloth. One is missing; Arlo says that's tradition." }
  coin_purse: { id: coin_purse, name: Coin Purse, slot: bag, description: "Doubled leather, no clink. Dren swears by it." }
  shadowstep_token: { id: shadowstep_token, name: Shadowstep Token, slot: bag, description: "A black glass bead. Warm when someone's watching." }
  silent_cloak: { id: silent_cloak, name: Silent Cloak, slot: bag, description: "Felted wool, dyed the colour of a closed door." }
