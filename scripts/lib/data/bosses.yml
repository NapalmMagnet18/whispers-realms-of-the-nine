# Every boss after the Candle Warden, run by scripts/boss.js (a placement names one by state.boss).
# Numbers agree with levels.yml: a hero has 1000 + 60/level health and hits x(1 + .08 per level) harder (~10 dps at lv 1,
# ~28 at 24, ~33 at 30, ~57 at 60). A dungeon boss falls to one hero of its level in ~60-80 s and to three in ~25 s;
# its unavoidable damage kills a lone hero in ~45-60 s, so dodging the telegraphs is the fight. Raid bosses (lv 60) are
# built for 5-10 heroes: raidScale adds that fraction of hp per extra hero in the arena when the fight opens.
# kinds: sweep (get out) · nova (get in to safe) · pools (step off) · cleave (get behind) · summon (adds).
# from: hp% at which an ability joins. color: fire frost void tide gold blood.

