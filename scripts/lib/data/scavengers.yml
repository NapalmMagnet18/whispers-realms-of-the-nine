# Quarry Scavengers (Q006's enemy, quest bible LANTCB5E-06), run by scripts/scavengers.js on the quarry-scavenger-camp.
# Seconds, metres, hit points. A cut lands on the mod's player.state.health (HUD max 1000).
hp: 70
aggro: 7          # close enough to pull one thief, not the whole camp (was 12)
dropAggro: 22
leash: 26
walk: 1.3
run: 5.6           # slower than a wolf: a scavenger is a thief, not a hunter
turn: 360
roamRadius: 6
roamPause: [3, 7]
strike: { damage: 38, windup: 0.75, start: 2.0, reach: 2.2, cooldown: 1.8, stopAt: 1.5 }
corpse: 3
fadeAt: 1.8
respawn: 25
reward: { xp: 30, copper: 6 }
model: /cdn/model-humanoid-fantasy-hollow-cultist-scavenger-gaunt-ash-grey-skin-tattered-black-hood-rusted-chains-bone-charms-jagged-pick-dark-gothic.glb   # was model-humanoid-fantasy-scavenger-male-ragged-hood-patched-leather-rusty-pick.glb
clips: { idle: Idle, walk: Walk, run: Run, attack: cdn/clip-attack.glb, hit: cdn/clip-hit-react.glb, die: cdn/clip-die.glb }
sounds:
  shout: /cdn/moodboard-painterly-fantasy/sfx-scavenger-gruff-shout-hey.mp3
  swing: /cdn/moodboard-painterly-fantasy/sfx-rusty-pick-swing-whoosh.mp3
  hit: /cdn/moodboard-painterly-fantasy/sfx-blunt-hit-thud.mp3
  die: /cdn/moodboard-painterly-fantasy/sfx-man-grunt-fall.mp3
# the crew: around the stashes and the broken lamp (138,40)
crew:
  - { id: quarry-scav-1, x: 132, z: 36, yaw: 40 }
  - { id: quarry-scav-2, x: 142, z: 28, yaw: 200 }
  - { id: quarry-scav-3, x: 150, z: 40, yaw: -60 }
  - { id: quarry-scav-4, x: 126, z: 26, yaw: 120 }
# what a crew wears while it stands, by the camp's tallyKey (scavengers-core puts it on at spawn, takes it off at death)
auras:
  drill_crew: |-
    fx
    pop soot rate=?mobile:3|7 on=disc(.3).c(1.5) life=1.4..2.2 v=up(.4..0.8)+sdir()*.15 size=.18..0.32 acc=buoy(.4)+curl(.4)*.5+drag(1) sz=$size*(.6>2.2) col=<.06,.055,.05>><.13,.12,.12> a=0>.12:.45>.6:.3>0 rot=spin(.12) r=sprite(smoke-puff,alpha)
    pop cinders rate=?mobile:2|5 on=disc(.2).c(1.6) life=.7..1.3 v=up(.6..1.2)+sdir()*.4 size=.015..0.03 acc=curl(1)+grav()*.3+drag(.5) col=hdr(4,1.8,.4)>hdr(1.2,.3,.05) a=(0>.1:1>.7:.8>0)*flick(12,.4) r=sprite(ember,add,velocity,.02)
    pop glow n=1 at=point().c(1.65) gl=flick(2.5,.35) r=light(<1,.5,.15>,$gl*.9,3)
  pit_warden: |-
    fx
    pop haze rate=?mobile:4|9 on=disc(.6).c(.4) life=2..3.2 v=up(.2..0.4)+sdir()*.3 size=.6..1 acc=buoy(.15)+curl(.3)*.4+drag(1.1) sz=$size*(.7>1.8) col=<.22,.1,.06> a=0>.15:.18>.6:.12>0 rot=spin(.08) r=sprite(smoke-puff,alpha)
