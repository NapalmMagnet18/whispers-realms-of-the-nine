# The realm roster: each realm is its own room of this world (its own world.state, wolves, oaks, chat).
# A hero lives on one realm; characters are saved per realm in the characters table.
# room: the room name (lowercase, digits, -), what pickRoom and cross() use.
realms:
  - { room: main,            name: "Lantern's Rest",  type: Normal,  region: "The March",  note: "the first realm, recommended" }
  - { room: realm-emberfall,  name: "Emberfall",       type: Normal,  region: "The March" }
  - { room: realm-greyspine,  name: "Greyspine Watch", type: Normal,  region: "The March" }
  - { room: realm-hollowmere, name: "Hollowmere",      type: PvP,     region: "The March",  note: "players can duel anywhere outside towns" }
  - { room: realm-saltwind,   name: "Saltwind",        type: RP,      region: "The March",  note: "stay in character" }
  - { room: realm-nine-veils, name: "The Nine Veils",  type: Normal,  region: "Far Shores" }
maxPlayersPerRealm: 120
charactersPerRealm: 6
