name: 'WHISPERS: Realms of the Nine'
description: A lantern-lit frontier town, a wolf-haunted forest and a copper quarry.
  Gather, craft, fight together.
camera: templates/camera.js#camera
lighting: scripts/lighting.js
defaultPlace: main-menu-land
engine:
  behaviors:
  - scripts/arrival.js
  networking:
    mode: multiplayer
  ui:
    theme:
      font: Geist Pixel Square
inputs:
  actions:
    jump:
      keys:
      - space
  axes:
    moveX:
      keys: a/d
    moveZ:
      keys: s/w
player: templates/player.js#player
ui:
  render: mods/mmorpg-tools/mod-mmorpg/ui.js
nametag: ui/nametag.js
authoring:
  starter:
    id: 3d
