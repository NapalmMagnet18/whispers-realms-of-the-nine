name: 'WHISPERS : Realm of the Nine'
description: A lantern-lit frontier town, a wolf-haunted forest and a copper quarry.
  Gather, craft, fight together.
camera: templates/camera.js#camera
lighting: scripts/lighting.js
defaultPlace: main-menu-land
engine:
  crons:
  - schedule: '* * * * *'
    script: crons/realm-pulse.js
  behaviors:
  - scripts/arrival.js
  networking:
    mode: multiplayer
  ui:
    theme:
      font: Geist Pixel Square
inputs:
  actions:
    vendorBuy: {}
    vendorSell: {}
    vendorTab: {}
    vendorClose: {}
    tradeTab: {}
    tradeLearn: {}
    tradeUnlearn: {}
    tradeCraft: {}
    tradeClose: {}
    ahTab: {}
    ahCat: {}
    ahRefresh: {}
    ahBuy: {}
    ahPick: {}
    ahPrice: {}
    ahList: {}
    ahCancel: {}
    ahCollect: {}
    ahClose: {}
    flyTo: {}
    flightClose: {}
    orbit:
      mouse: left
      activeOn: hold
    steer:
      mouse: right
      activeOn: hold
    autoRun:
      keys:
      - q
    autoRunStop:
      keys:
      - w
    release:
      keys:
      - escape
    attack:
      keys:
      - Digit1
    castSlot2:
      keys:
      - Digit2
    castSlot3:
      keys:
      - Digit3
    jump:
      keys:
      - space
    interact:
      keys:
      - e
    acceptQuest: {}
    declineQuest: {}
    completeQuest: {}
    closeQuestDialog: {}
  axes:
    moveX:
      keys: a/d
    moveZ:
      keys: s/w
player: templates/player.js#player
ui:
  render: mods/mmorpg-tools/mod-mmorpg/ui.js
nametag: ui/nametag.js
authoring:
  starter:
    id: 3d
routing:
  script: scripts/routing.js
  maxPlayers: 120
audio:
  gains: { Master: 1, Music: 0.85, SFX: 1, UI: 0.8, Ambience: 0.55, Voice: 1 }
  maxVoices: 40
