# The Root Archive: an instanced dungeon (scripts/gen/instance.js layout root-archive). Entry gate at z = 0, chambers run toward -Z.
# The way in and out is the gate pair root-gate (place main) <-> root-gate-in (here). Bosses: scripts/boss.js + scripts/lib/data/bosses.yml.
mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 0, y: 0.2, z: -4 }
worldBounds: { bottom: -30 }
atmosphere:
  sky: { kind: solid, color: "oklch(0.08 0.02 120)" }
  timeOfDay: 0
  sun: { intensity: 0 }
  moon: { enabled: false }
  stars: { enabled: false }
  clouds: { enabled: false }
  ambient: { light: { color: "oklch(0.62 0.07 110)", intensity: 1.95 } }
  hemisphere: { sky: "oklch(0.62 0.07 110)", ground: "oklch(0.3 0.03 60)", intensity: 1.0 }
  fog: { kind: linear, color: "oklch(0.17 0.04 120)", near: 18, far: 110 }
  look: # ray-traced reflections, contact shadows and bloom (mods/raytraced-lighting); was aaa-quality-kit look-cinema
    script: mods/raytraced-lighting/look-raytrace.js
    params: { reflection: 0.9, baseReflect: 0.04, maxDistance: 22, denoise: 0.42, blurRadius: 1.0, aoStrength: 0.55, aoRadius: 1.4, bloom: 1.0, bloomThreshold: 0.5, bloomSpread: 1.1 }
acoustics:
  reverb: 0.5
# heroes arrive here from the open world, its game code already loaded; a cold boot only on a reconnect inside
arrivalBudget: { bytes: 720000 }
