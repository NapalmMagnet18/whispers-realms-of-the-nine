# Assembly of the Ninth: an instanced raid (scripts/gen/instance.js layout ninth-assembly). Entry gate at z = 0, chambers run toward -Z.
# The way in and out is the gate pair assembly-gate (place main) <-> assembly-gate-in (here). Bosses: scripts/boss.js + scripts/lib/data/bosses.yml.
mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 0, y: 0.2, z: -4 }
worldBounds: { bottom: -30 }
atmosphere:
  sky: { kind: solid, color: "oklch(0.07 0.03 300)" }
  timeOfDay: 0
  sun: { intensity: 0 }
  moon: { enabled: false }
  stars: { enabled: false }
  clouds: { enabled: false }
  ambient: { light: { color: "oklch(0.62 0.07 300)", intensity: 1.5 } }
  hemisphere: { sky: "oklch(0.62 0.07 300)", ground: "oklch(0.3 0.03 60)", intensity: 1.0 }
  fog: { kind: linear, color: "oklch(0.17 0.05 300)", near: 18, far: 110 }
  look:
    script: mods/aaa-quality-kit/look-cinema.js
    params: { dayWarmth: 0.04, grain: 0.03 }
acoustics:
  reverb: 0.5
