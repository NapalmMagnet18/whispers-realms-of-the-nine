atmosphere:
  clouds:
    altitude: 600
    density: 0.85
    enabled: true
    opacity: 0.8
    thickness: 900
  fog:
    far: 650
    kind: linear
    near: 250
  look:
    script: scripts/look-default.js
  moon:
    intensity: 3
  sky:
    kind: realistic
    model: hosek
  stars:
    density: 0.6
    enabled: true
    milkyWay: 0.6
  timeOfDay: 15
  wind:
    direction: 230
    speed: 2
defaultSpawnPoint:
  x: 0
  y:
    terrain: 0
  z: 0
gravity:
  x: 0
  y: -24
  z: 0
mode: 3d
terrain:
  decorations:
    bindings:
      grass:
        - flower
        - grass
        - pebble
    layers:
      flower:
        density: 0.15
        items:
          - colorJitter:
              hue: 8
              value: 0.1
            kind: scripted
            params:
              heart: "#3a3a3d"
              petal: "#a4161a"
            randomRotation: true
            scale:
              - 0.8
              - 1.3
            script: scripts/flower.js
            seed: 1
            wind:
              force: 0.04
      grass:
        density: 28
        items:
          - kind: scripted
            randomRotation: true
            scale:
              - 0.8
              - 1.4
            script: scripts/grass.js
            seed: 1
            wind:
              force: 0.06
        material:
          kind: scripted
          script: scripts/grass-look.js
      pebble:
        density: 0.4
        items:
          - colorJitter:
              hue: 0
              value: 0.15
            kind: scripted
            params:
              stone: "#6e6a5e"
            randomRotation: true
            scale:
              - 0.6
              - 1.6
            script: scripts/pebble.js
            seed: 1
  generator: scripts/flat-starter-terrain.js
  kind: heightmap
  materials:
    - albedo: cdn/texture-terrain-grass-realistic-albedo-summer-exploration.png
      id: grass
      pbr: true
      tint: oklch(0.45 0.02 140)
    - albedo: cdn/texture-terrain-gravel-realistic-albedo.png
      id: gravel
      pbr: true
      tint: oklch(0.70 0.02 80)
    - albedo: cdn/texture-terrain-rock-realistic-albedo.png
      id: rock
      pbr: true
      tint: oklch(0.58 0.02 260)
  seed: 1
