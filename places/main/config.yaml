atmosphere:
  clouds:
    altitude: 700
    density: 0.55
    enabled: true
    opacity: 0.75
    thickness: 800
    speed: 1
  fog:
    kind: linear
    near: 140
    far: 700
  look:
    script: mods/aaa-quality-kit/look-cinema.js
    params:
      dayWarmth: 0.08
      grain: 0.02
  moon:
    intensity: 3
  sky:
    kind: realistic
    model: hosek
  stars:
    density: 0.6
    enabled: true
    milkyWay: 0.6
  timeOfDay: 16.9
  wind:
    direction: 230
    speed: 3
defaultSpawnPoint:
  x: 0
  y:
    terrain: 0
  z: 8
gravity:
  x: 0
  y: -24
  z: 0
mode: 3d
terrain:
  decorations:
    bindings:
      grass:
      - flower
      - grass
      - pebble
      forest:
      - fern
      - pebble
      gravel:
      - pebble
    layers:
      flower:
        density: 0.35
        items:
        - colorJitter:
            hue: 8
            value: 0.1
          kind: scripted
          params:
            heart: '#e8c35a'
            petal: '#c94a3a'
          randomRotation: true
          scale:
          - 0.8
          - 1.3
          script: scripts/flower.js
          seed: 1
          wind:
            force: 0.04
      grass:
        density: 28
        items:
        - kind: scripted
          randomRotation: true
          scale:
          - 0.8
          - 1.4
          script: scripts/grass.js
          seed: 1
          wind:
            force: 0.06
        material:
          kind: scripted
          script: scripts/grass-look.js
      pebble:
        density: 0.4
        items:
        - colorJitter:
            hue: 0
            value: 0.15
          kind: scripted
          params:
            stone: '#8a8070'
          randomRotation: true
          scale:
          - 0.6
          - 1.6
          script: scripts/pebble.js
          seed: 1
      fern:
        density: 6
        items:
        - kind: scripted
          script: scripts/grass.js
          seed: 4
          randomRotation: true
          scale:
          - 1.4
          - 2.2
          wind:
            force: 0.05
        material:
          kind: scripted
          script: scripts/grass-look.js
  generator: scripts/terrain-reach.js
  kind: heightmap
  materials:
  - id: grass
    albedo: cdn/texture-terrain-grass-realistic-albedo-summer-exploration.png
    pbr: true
    tint: oklch(0.78 0.06 125)
    antiTiling: stochastic
  - id: gravel
    albedo: cdn/texture-terrain-gravel-realistic-albedo.png
    pbr: true
    tint: oklch(0.80 0.03 70)
  - id: rock
    albedo: cdn/texture-terrain-rock-realistic-albedo.png
    pbr: true
    tint: oklch(0.78 0.02 60)
    antiTiling: stochastic
  - id: forest
    albedo: cdn/texture-terrain-forest-floor-moss-pine-needles-realistic-albedo.png
    pbr: true
    tint: oklch(0.85 0.03 100)
  - id: cobble
    albedo: cdn/texture-terrain-worn-cobblestone-realistic-albedo.png
    pbr: true
    tint: oklch(0.85 0.02 70)
    textureScale: 3
  - id: dirt
    albedo: cdn/texture-terrain-packed-dirt-path-realistic-albedo.png
    pbr: true
    tint: oklch(0.85 0.03 70)
