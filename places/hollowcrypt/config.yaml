# The Hollowcrypt: the first sealed district under Lantern's Reach (DHC-01..04). Halls are scripts/gen/crypt.js; the way in
# and out is the gate pair crypt-gate (Hollowcrypt Vale, place main) <-> crypt-gate-in (here).
mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 0, y: 0.2, z: -3 }
worldBounds: { bottom: -30 }
atmosphere:
  sky: { kind: solid, color: "oklch(0.06 0.01 290)" }
  timeOfDay: 0
  sun: { intensity: 0 }
  moon: { enabled: false }
  stars: { enabled: false }
  clouds: { enabled: false }
  ambient: { light: { color: "oklch(0.6 0.05 290)", intensity: 1.4 } }
  hemisphere: { sky: "oklch(0.45 0.05 290)", ground: "oklch(0.3 0.03 60)", intensity: 1.0 }
  fog: { kind: linear, color: "oklch(0.14 0.03 290)", near: 14, far: 90 }
  look:
    script: mods/aaa-quality-kit/look-cinema.js
    params: { dayWarmth: 0.04, grain: 0.03 }
