# The Pale Choir: an instanced raid (scripts/gen/instance.js layout pale-choir). Entry gate at z = 0, chambers run toward -Z.
# The way in and out is the gate pair choir-gate (place main) <-> choir-gate-in (here). Bosses: scripts/boss.js + scripts/lib/data/bosses.yml.
mode: 3d
terrain:
  kind: "off"
gravity: { x: 0, y: -24, z: 0 }
defaultSpawnPoint: { x: 0, y: 0.2, z: -4 }
worldBounds: { bottom: -30 }
atmosphere:
  sky: { kind: solid, color: "oklch(0.06 0.01 80)" }
  timeOfDay: 0
  sun: { intensity: 0 }
  moon: { enabled: false }
  stars: { enabled: false }
  clouds: { enabled: false }
  ambient: { light: { color: "oklch(0.62 0.03 80)", intensity: 1.5 } }
  hemisphere: { sky: "oklch(0.62 0.03 80)", ground: "oklch(0.3 0.03 60)", intensity: 1.0 }
  fog: { kind: linear, color: "oklch(0.16 0.02 70)", near: 18, far: 110 }
  look: # ray-traced reflections, contact shadows and bloom (mods/raytraced-lighting); was aaa-quality-kit look-cinema
    script: mods/raytraced-lighting/look-raytrace.js
    params: { reflection: 1.15, baseReflect: 0.06, maxDistance: 26, denoise: 0.4, blurRadius: 0.9, aoStrength: 0.45, bloom: 1.2, bloomThreshold: 0.48, bloomSpread: 1.2 }
acoustics:
  reverb: 0.5
# heroes arrive here from the open world, its game code already loaded; a cold boot only on a reconnect inside
arrivalBudget: { bytes: 720000 }
