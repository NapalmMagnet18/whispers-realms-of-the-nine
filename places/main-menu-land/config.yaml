atmosphere:
  clouds:
    altitude: 700
    density: 0.3
    enabled: true
    opacity: 0.55
    thickness: 500
    speed: 1.5
  fog:
    far: 420
    kind: linear
    near: 45
  look:
    script: scripts/look-default.js
  moon:
    intensity: 4
    enabled: true
    phase: 0.5
    size: 2.6
  sky:
    kind: realistic
    model: hosek
  stars:
    density: 0.85
    enabled: true
    milkyWay: 0.8
  timeOfDay: 18.2
  wind:
    direction: 230
    speed: 1.2
defaultSpawnPoint:
  x: 0
  y:
    terrain: 0
  z: 0
gravity:
  x: 0
  y: -24
  z: 0
mode: 3d
terrain:
  decorations:
    bindings:
      grass:
        - flower
        - grass
        - pebble
    layers:
      flower:
        density: 0.15
        items:
          - colorJitter:
              hue: 8
              value: 0.1
            kind: scripted
            params:
              heart: "#3a3a3d"
              petal: "#a4161a"
            randomRotation: true
            scale:
              - 0.8
              - 1.3
            script: scripts/flower.js
            seed: 1
            wind:
              force: 0.04
      grass:
        density: 28
        items:
          - kind: scripted
            randomRotation: true
            scale:
              - 0.8
              - 1.4
            script: scripts/grass.js
            seed: 1
            wind:
              force: 0.06
        material:
          kind: scripted
          script: scripts/grass-look.js
      pebble:
        density: 0.4
        items:
          - colorJitter:
              hue: 0
              value: 0.15
            kind: scripted
            params:
              stone: "#6e6a5e"
            randomRotation: true
            scale:
              - 0.6
              - 1.6
            script: scripts/pebble.js
            seed: 1
  generator: scripts/flat-starter-terrain.js
  kind: heightmap
  materials:
    - {albedo: cdn/texture-terrain-grass-realistic-albedo-summer-exploration.png, id: grass, pbr: true, tint: oklch(0.8 0.04 120)}
    - {albedo: cdn/texture-terrain-gravel-realistic-albedo.png, id: gravel, pbr: true, tint: oklch(0.85 0.02 80)}
    - {albedo: cdn/texture-terrain-rock-realistic-albedo.png, id: rock, pbr: true, tint: oklch(0.8 0.02 260)}
  seed: 1
  marks:
    gatepath: {center: {x: 0, z: -10}, kind: clear-scatter, shape: {depth: 40, kind: rectangle, width: 9}}
    gatedais: {center: {x: 0, z: -24}, kind: clear-scatter, shape: {kind: circle, radius: 16}}
